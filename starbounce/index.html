/* ---- candy walls: the reflective surfaces the child learns to bank off ---- */
let wallSprite=null;
function bakeWalls(){
  const c=offscreen(VW,VH), x=c.getContext('2d');
  const paint=(px,py,w,h,vertical)=>{
    const g = vertical ? x.createLinearGradient(px,0,px+w,0) : x.createLinearGradient(0,py,0,py+h);
    g.addColorStop(0, 'hsl(268,60%,32%)');
    g.addColorStop(.32,'hsl(278,74%,52%)');
    g.addColorStop(.70,'hsl(304,76%,44%)');
    g.addColorStop(1, 'hsl(262,60%,28%)');
    rrect(x,px,py,w,h,Math.min(w,h)/2); x.fillStyle=g; x.fill();
    x.save(); rrect(x,px,py,w,h,Math.min(w,h)/2); x.clip();
    x.globalAlpha=.22; x.fillStyle='#fff';
    for(let i=-24;i<44;i++){
      x.save(); x.translate(px,py); x.rotate(-0.62);
      if(vertical) x.fillRect(-60, i*54, 220, 17);
      else x.fillRect(i*54, -60, 17, 240);
      x.restore();
    }
    x.restore(); x.globalAlpha=1;
    x.lineWidth=3.5; x.strokeStyle='hsla(292,100%,88%,.6)';
    rrect(x,px+2,py+2,w-4,h-4,Math.min(w,h)/2); x.stroke();
  };
  paint(3, CEIL-WALL+3, WALL-6, VH-CEIL+WALL-6, true);
  paint(VW-WALL+3, CEIL-WALL+3, WALL-6, VH-CEIL+WALL-6, true);
  paint(3, CEIL-WALL+3, VW-6, WALL-6, false);
  return c;
}
function drawWalls(c, glow, t){
  if(glow){
    c.globalCompositeOperation='lighter';
    c.fillStyle='rgba(190,150,255,.22)';
    c.fillRect(0,CEIL-WALL,WALL,VH-CEIL+WALL);
    c.fillRect(VW-WALL,CEIL-WALL,WALL,VH-CEIL+WALL);
    c.fillRect(0,CEIL-WALL,VW,WALL);
    c.globalCompositeOperation='source-over';
    return;
  }
  if(!wallSprite) wallSprite=bakeWalls();
  c.drawImage(wallSprite,0,0);
  // a light that slides along the rails to keep them alive
  const p=(t*0.10)%1, sy=CEIL+(VH-CEIL)*p;
  c.save(); c.globalCompositeOperation='lighter';
  for(const wx of [WALL/2, VW-WALL/2]) drawDot(c,wx,sy,52,290,0.26);
  c.restore();
}

/* ---- Star Cannon on its floating meadow ---- */
let cannonIsland=null;
function drawLauncher(c, glow, t){
  const ang=G.aimAng;
  const mx=LAUNCH_X+Math.sin(ang)*MUZZLE, my=LAUNCH_Y-Math.cos(ang)*MUZZLE;
  if(glow){
    c.globalCompositeOperation='lighter';
    drawDot(c,mx,my,58,45,0.35+G.aimPow*0.45);
    c.globalCompositeOperation='source-over'; return;
  }
  if(!cannonIsland) cannonIsland = makeIsland(260,190,5,132);
  c.drawImage(cannonIsland, LAUNCH_X-130, LAUNCH_Y-30, 260, 190);

  // power ring
  const segs=5, filled=Math.round(G.aimPow*segs+0.001);
  for(let i=0;i<segs;i++){
    const a0=Math.PI*0.86 + i*(Math.PI*1.28/segs)+0.03;
    const a1=a0 + (Math.PI*1.28/segs)-0.09;
    c.lineWidth=11; c.lineCap='round';
    c.strokeStyle = i<filled ? hsl(lerp(190,10,i/(segs-1)),100,62) : 'rgba(255,255,255,.18)';
    c.beginPath(); c.arc(LAUNCH_X,LAUNCH_Y,50,a0,a1); c.stroke();
    if(i<filled){
      c.strokeStyle=hsl(lerp(190,10,i/(segs-1)),100,84,.6); c.lineWidth=4;
      c.beginPath(); c.arc(LAUNCH_X,LAUNCH_Y,50,a0,a1); c.stroke();
    }
  }
  // barrel — chunky toy cannon with a dark contour so bloom can't wash it out
  c.save(); c.translate(LAUNCH_X,LAUNCH_Y); c.rotate(ang);
  const bl=94, bw=34;
  c.fillStyle='rgba(14,5,34,.45)'; rrect(c,-bw/2+4,-bl+6,bw,bl+22,bw/2); c.fill();
  rrect(c,-bw/2,-bl,bw,bl+18,bw/2);
  c.lineWidth=7; c.lineJoin='round'; c.strokeStyle='rgba(24,8,52,.92)'; c.stroke();
  const bg=c.createLinearGradient(-bw/2,0,bw/2,0);
  bg.addColorStop(0,'hsl(224,72%,26%)'); bg.addColorStop(.26,'hsl(206,92%,62%)');
  bg.addColorStop(.58,'hsl(202,88%,48%)'); bg.addColorStop(1,'hsl(226,72%,22%)');
  c.fillStyle=bg; c.fill();
  for(let i=0;i<3;i++){
    rrect(c,-bw/2-2,-bl+26+i*24,bw+4,6,3);
    c.fillStyle='hsl(46,100%,62%)'; c.fill();
  }
  // muzzle lip
  rrect(c,-bw/2-5,-bl-5,bw+10,17,8);
  c.lineWidth=5; c.strokeStyle='rgba(24,8,52,.92)'; c.stroke();
  const ml=c.createLinearGradient(-bw/2,0,bw/2,0);
  ml.addColorStop(0,'hsl(208,60%,44%)'); ml.addColorStop(.4,'hsl(196,90%,80%)');
  ml.addColorStop(1,'hsl(210,60%,40%)');
  c.fillStyle=ml; c.fill();
  c.restore();
  // base sphere
  const sg=c.createRadialGradient(LAUNCH_X-12,LAUNCH_Y-14,3,LAUNCH_X,LAUNCH_Y,38);
  sg.addColorStop(0,'#fff3c8'); sg.addColorStop(.4,'#ffcf5e');
  sg.addColorStop(.8,'#ff9433'); sg.addColorStop(1,'#c9541c');
  c.beginPath(); c.arc(LAUNCH_X,LAUNCH_Y,36,0,TAU);
  c.lineWidth=7; c.strokeStyle='rgba(28,10,58,.9)'; c.stroke();
  c.fillStyle=sg; c.fill();
  c.lineWidth=4; c.strokeStyle='rgba(255,255,255,.5)';
  c.beginPath(); c.arc(LAUNCH_X,LAUNCH_Y,30,Math.PI*.15,Math.PI*.95); c.stroke();
  // Zip waiting in the muzzle
  if(G.state==='aim'||G.state==='title'){
    const bob=Math.sin(t*3)*2;
    const zx=LAUNCH_X+Math.sin(ang)*MUZZLE, zy=LAUNCH_Y-Math.cos(ang)*MUZZLE+bob;
    const g2=c.createRadialGradient(zx-5,zy-6,1,zx,zy,ZIP_R);
    g2.addColorStop(0,'#fffdf2'); g2.addColorStop(.3,'#ffe9a3');
    g2.addColorStop(.7,'#ffc44d'); g2.addColorStop(1,'#f2652b');
    c.fillStyle=g2; c.beginPath(); c.arc(zx,zy,ZIP_R,0,TAU); c.fill();
    drawFace(c,zx,zy,ZIP_R*0.95,t*2.2,'happy',Math.sin(ang));
  }
}

/* ---- the adaptive prediction guide ---- */
function drawGuide(c, glow, t){
  if(G.state!=='aim') return;
  const pow=lerp(PMIN,PMAX,G.aimPow);
  const ox=LAUNCH_X+Math.sin(G.aimAng)*MUZZLE, oy=LAUNCH_Y-Math.cos(G.aimAng)*MUZZLE;
  const vx=Math.sin(G.aimAng)*pow, vy=-Math.cos(G.aimAng)*pow;
  const pts=simulate(ox,oy,vx,vy,G.guideT,G.world,true);
  const step=7, n=pts.length;
  c.globalCompositeOperation='lighter';
  for(let i=step;i<n;i+=step){
    const k=i/n;
    const p=pts[i];
    const flow=(Math.sin(k*14 - t*7)*0.5+0.5);
    const r=lerp(8.5,3.2,k)*(0.82+flow*0.34)*(glow?1.5:1);
    const a=(1-k*0.72)*(0.55+flow*0.45)*(glow?0.5:0.95);
    drawDot(c,p.x,p.y,r*2.4,lerp(48,190,k),a);
  }
  c.globalCompositeOperation='source-over';
  if(glow) return;
  // launch arrow
  c.save(); c.translate(ox,oy); c.rotate(G.aimAng);
  const L=26+G.aimPow*22;
  c.fillStyle='rgba(255,255,255,.92)';
  c.beginPath(); c.moveTo(0,-L-16); c.lineTo(11,-L+2); c.lineTo(-11,-L+2); c.closePath(); c.fill();
  c.restore();
}

/* ---- assemble the world ---- */
function drawWorld(c, glow){
  const t=G.t, w=G.world;
  drawWalls(c,glow,t);
  if(w){
    for(const r of w.rails) r.draw(c,glow,t);
    for(const b of w.bumpers) b.draw(c,glow,t);
    for(const b of w.stars) b.draw(c,glow,t);
  }
  drawGuide(c,glow,t);
  drawLauncher(c,glow,t);
  G.zip.draw(c,glow,t);
  if(!glow || QUAL.particleGlow) drawParticles(c,glow);
  for(const f of G.freed) f.draw(c,glow,t);
}

function renderBloom(){
  gctx.setTransform(1,0,0,1,0,0);
  gctx.clearRect(0,0,glowCvs.width,glowCvs.height);
  gctx.setTransform(1/GLOW_DIV,0,0,1/GLOW_DIV, G.shakeX/GLOW_DIV, G.shakeY/GLOW_DIV);
  gctx.globalAlpha=1; gctx.globalCompositeOperation='source-over';
  drawWorld(gctx,true);

  // downsample twice — bilinear filtering does the blurring for us
  actx.setTransform(1,0,0,1,0,0);
  actx.globalCompositeOperation='copy';
  actx.drawImage(glowCvs,0,0,bloomA.width,bloomA.height);
  bctx.setTransform(1,0,0,1,0,0);
  bctx.globalCompositeOperation='copy';
  bctx.drawImage(bloomA,0,0,bloomB.width,bloomB.height);

  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.imageSmoothingQuality='low';
  ctx.globalAlpha=0.34 + G.fever*0.12;
  ctx.drawImage(bloomA,0,0,VW,VH);
  ctx.globalAlpha=0.40 + G.fever*0.18;
  ctx.drawImage(bloomB,0,0,VW,VH);
  ctx.restore();
}

let vigSprite=null;
function vignette(c){

  }
  c.drawImage(vigSprite,0,0);

  }

    c.fillStyle=`rgba(255,244,210,${G.flash*0.5})`;
    c.fillRect(0,0,VW,VH);
    c.globalCompositeOperation='source-over';
  }
}

/* ================================================================== 12. HUD ============= */
function panel(c,x,y,w,h,r,alpha=0.55){
  c.save();
  rrect(c,x,y,w,h,r);
  const g=c.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,`rgba(46,26,92,${alpha+0.16})`);
  g.addColorStop(1,`rgba(22,10,52,${alpha})`);
  c.fillStyle=g; c.fill();
  c.lineWidth=3; c.strokeStyle='rgba(255,255,255,.20)'; c.stroke();
  rrect(c,x+3,y+3,w-6,h*0.45,r*0.8);
  const hg=c.createLinearGradient(0,y,0,y+h*0.5);
  hg.addColorStop(0,'rgba(255,255,255,.13)'); hg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=hg; c.fill();
  c.restore();
}
function miniStar(c,x,y,r,on,t,i=0){
  c.save(); c.translate(x,y); c.rotate(on? Math.sin(t*2+i)*0.16 : 0.1);
  starPath(c,0,0,r,r*0.45,5,-Math.PI/2);
  if(on){
    const g=c.createLinearGradient(0,-r,0,r);
    g.addColorStop(0,'#fff6c2'); g.addColorStop(.5,'#ffd447'); g.addColorStop(1,'#ff9d18');

    c.lineWidth=r*0.20; c.strokeStyle='rgba(255,255,255,.28)'; c.lineJoin='round'; c.stroke();
  }

}
/* chunky key caps */
function keycap(c,x,y,glyph,label,w){
  const h=30; w=w|| (label? Math.max(44, measure(c,label,17,900)+22) : 34);
  const g=c.createLinearGradient(0,y-h/2,0,y+h/2);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.55,'#eceaf6'); g.addColorStop(1,'#c9c4e0');
  rrect(c,x,y-h/2,w,h,9); c.fillStyle='rgba(14,6,34,.55)'; c.fill();
  rrect(c,x,y-h/2-3,w,h,9); c.fillStyle=g; c.fill();
  c.lineWidth=1.5; c.strokeStyle='rgba(60,40,110,.35)'; c.stroke();
  const cx=x+w/2, cy=y-3;
  c.fillStyle='#3b2470';
  if(glyph){
    c.save(); c.translate(cx,cy);
    const rot={left:Math.PI,right:0,up:-Math.PI/2,down:Math.PI/2}[glyph]||0;
    c.rotate(rot);
    c.beginPath(); c.moveTo(6,0); c.lineTo(-4,-7); c.lineTo(-4,7); c.closePath(); c.fill();
    c.restore();
  } else if(label){
    text(c,label,cx,cy,{size:16,weight:900,fill:'#3b2470',stroke:0,shadow:false});
  }
  return w;
}
function drawHintBar(c){
  const key = (G.state==='aim'||G.state==='fly') ? 'aim' : 'go';
  let spr=drawHintBar.cache[key];
  if(!spr){
    const items = key==='aim'
      ? [{k:['left','right'],t:'Aim'},{k:['up','down'],t:'Power'},{k:[],l:'SPACE',t:'Launch!'},{k:[],l:'Q',t:'Grown-ups'}]
      : [{k:[],l:'SPACE',t:'Go!'},{k:[],l:'Q',t:'Grown-ups'}];
    let total=0;
    for(const it of items){
      let w=0;
      for(const g of it.k) w+=36;
      if(it.l) w+=Math.max(44, measure(ctx,it.l,17,900)+22)+2;
      w+=10+measure(ctx,it.t,19,800)+26;
      total+=w;
    }
    const h=44, W=total+40;
    spr=offscreen(W,h+8); const x=spr.getContext('2d');
    const cy=h/2+4;
    panel(x,0,4,W,h,20,0.72);
    let px=20;
    for(const it of items){
      for(const g of it.k){ keycap(x,px,cy,g,null,34); px+=36; }
      if(it.l){ px+=keycap(x,px,cy,null,it.l)+2; }
      px+=10;
      text(x,it.t,px,cy-2,{size:19,weight:800,align:'left',fill:['#ffffff','#ded7ff'],
        stroke:3.4,strokeColor:'rgba(20,8,46,.9)',shadow:false});
      px+=measure(ctx,it.t,19,800)+26;
    }
    drawHintBar.cache[key]=spr;
  }
  c.drawImage(spr, VW/2-spr.width/2, VH-16-spr.height/2);
}

/* static header chrome is baked once — only the live numbers are drawn per frame */
const SS_X = 1052, SS_PITCH = 30, SS_W = 24;      // star-sense pips
let hudChrome=null;
function bakeHudChrome(){
  const px=WALL+2, pw=VW-2*WALL-4;
  const c=offscreen(VW,92), x=c.getContext('2d');
  panel(x,px,6,pw,72,20,0.55);
  text(x,'FRIENDS',   px+96, 20, {size:15,fill:'rgba(255,255,255,.7)',stroke:0,shadow:false,letter:'2px'});
  text(x,'TIME LEFT', VW/2,  20, {size:15,fill:'rgba(255,255,255,.7)',stroke:0,shadow:false,letter:'2px'});
  text(x,'SCORE',     820,   20, {size:15,fill:'rgba(255,255,255,.7)',stroke:0,shadow:false,letter:'2px'});
  text(x,'STAR SENSE',SS_X+(SS_PITCH*4+SS_W)/2, 20,
    {size:14,fill:'rgba(255,255,255,.7)',stroke:0,shadow:false,letter:'1px'});
  return c;
}
function drawHUD(c){
  const t=G.t;
  if(G.state==='title'){ drawHintBar(c); return; }
  if(!hudChrome) hudChrome=bakeHudChrome();
  c.drawImage(hudChrome,0,0);

  // friends rescued
  const px=WALL+2;
  drawFuzzle(c, px+50, 50, 15, 190, 0, t*1.4, 1);
  text(c, String(G.rescued), px+112, 50,
    {size:40,fill:['#ffffff','#9be7ff','#4fb8f0'],stroke:6,shadow:false});

  // the clock — the only resource in the game, so it gets the centre and the biggest type
  const low = G.timeLeft<=10;
  const beat = low ? 1+0.09*Math.abs(Math.sin(t*6)) : 1;
  const secs = Math.max(0, Math.ceil(G.timeLeft));
  c.save(); c.translate(VW/2, 52); c.scale(beat,beat);
  text(c, secs+'s', 0, 0, {size:46, stroke:7, shadow:false,
    fill: low ? ['#fff3c0','#ff9d5c','#ff5a3c'] : ['#ffffff','#ffd447','#ff9d18']});
  c.restore();
  // time bar
  const bw=250, bx=VW/2-bw/2, by=76;
  rrect(c,bx,by,bw,7,4); c.fillStyle='rgba(255,255,255,.16)'; c.fill();
  const f=clamp(G.timeLeft/ROUND,0,1);
  if(f>0){
    c.save(); rrect(c,bx,by,bw,7,4); c.clip();
    c.fillStyle = low ? hsl(lerp(40,4,1-f/0.111),100,62) : hsl(lerp(190,48,1-f),100,64);
    c.fillRect(bx,by,bw*f,7); c.restore();
  }

  // score
  text(c, G.score.toLocaleString('en-US'), 820, 52,
    {size:34,fill:['#ffffff','#ffd447','#ff9d18'],stroke:5,shadow:false});

  // star sense (the adaptive-skill readout)
  const pips=5, lvl=G.skill*pips;
  for(let i=0;i<pips;i++){
    const fp=clamp(lvl-i,0,1);
    const bx2=SS_X+i*SS_PITCH, by2=40, bh=17;
    rrect(c,bx2,by2,SS_W,bh,7); c.fillStyle='rgba(255,255,255,.14)'; c.fill();
    if(fp>0){
      c.save(); rrect(c,bx2,by2,SS_W,bh,7); c.clip();
      const g=c.createLinearGradient(bx2,by2,bx2,by2+bh);
      const hue=lerp(190,300,i/(pips-1));
      g.addColorStop(0,hsl(hue,100,80)); g.addColorStop(1,hsl(hue,100,58));
      c.fillStyle=g; c.fillRect(bx2,by2,SS_W*fp,bh);
      c.restore();
    }
    c.lineWidth=2; c.strokeStyle='rgba(255,255,255,.30)'; rrect(c,bx2,by2,SS_W,bh,7); c.stroke();
  }

  // combo
  if(G.combo>1 && G.state==='fly'){
    const s=1+Math.min(G.combo,6)*0.06;
    c.save(); c.translate(VW/2, 126); c.scale(s,s);
    text(c,'COMBO x'+G.combo,0,0,{size:34,fill:['#fff',hsl((t*200)%360,100,66)],stroke:6});
    c.restore();
  }
  // first-run nudges
  if(G.tutorial>0){
    const msg = G.tutorial===1 ? 'Hold \u25c0 \u25b6 to aim, \u25b2 \u25bc for power — then press SPACE!'
                               : 'Pop the golden stars — bounce off the walls and jelly blobs!';
    text(c,msg,VW/2,VH-74,{size:26,fill:['#ffffff',hsl(45,100,72)],stroke:6,shadowBlur:12});
    if(G.state==='aim' && G.tutorial===1){
      const bx3=LAUNCH_X+Math.sin(G.aimAng)*150, by3=LAUNCH_Y-Math.cos(G.aimAng)*150;
      c.save(); c.translate(bx3,by3+Math.sin(t*6)*7);
      c.globalAlpha=0.65+0.35*Math.sin(t*4);
      c.fillStyle='#fff'; c.beginPath();
      c.moveTo(0,-16); c.lineTo(13,8); c.lineTo(-13,8); c.closePath(); c.fill();
      c.restore(); c.globalAlpha=1;
    }
  }
  drawHintBar(c);
}
drawHintBar.cache={};

/* ================================================================== 13. SCREENS ========= */
const TIPS = [
  'Bounce off the candy walls to reach the tricky stars!',
  'Hold  \u25b2  for a long shot,  \u25bc  for a gentle lob.',
  'Jelly blobs bounce Zip — aim at them on purpose!',
  'Aim a little ABOVE a star. Zip curves down as it flies.',
  'Pop two stars in one shot for a big combo!'
];

function bigZip(c,x,y,r,t,mood='happy'){
  const bob=Math.sin(t*2.4)*r*0.09;
  y+=bob;
  c.save();
  c.globalCompositeOperation='lighter';
  drawDot(c,x,y,r*2.6,45,0.55);
  c.restore();
  c.save(); c.translate(x,y); c.rotate(Math.sin(t*1.6)*0.10);
  starPath(c,0,0,r*1.62,r*0.74,5,-Math.PI/2);
  c.fillStyle=`hsla(${(t*70)%360},100%,74%,.34)`; c.fill();
  c.lineWidth=r*0.05; c.strokeStyle=`hsla(${(t*70)%360},100%,88%,.5)`; c.stroke();
  c.restore();
  const g=c.createRadialGradient(x-r*.36,y-r*.42,r*.06,x,y,r*1.1);
  g.addColorStop(0,'#fffdf2'); g.addColorStop(.28,'#ffe9a3');
  g.addColorStop(.62,'#ffc44d'); g.addColorStop(.9,'#ff8f3c'); g.addColorStop(1,'#f2652b');
  c.beginPath(); c.arc(x,y,r,0,TAU);
  c.lineWidth=r*0.13; c.strokeStyle='rgba(46,14,74,.85)'; c.stroke();
  c.fillStyle=g; c.fill();
  c.lineWidth=r*.09; c.strokeStyle='rgba(255,255,255,.6)';
  c.beginPath(); c.arc(x,y,r*.86,Math.PI*.12,Math.PI*.9); c.stroke();
  drawFace(c,x,y+r*0.04,r*0.70,t*2.2,mood);
  c.fillStyle='rgba(255,255,255,.9)';
  c.beginPath(); c.ellipse(x-r*.38,y-r*.42,r*.20,r*.14,-0.5,0,TAU); c.fill();
}

function pressHint(c,y,label,tail){
  const t=G.t, pulse=1+Math.sin(t*4)*0.035;
  c.save(); c.translate(VW/2,y); c.scale(pulse,pulse);
  const lw=Math.max(52, measure(c,label,17,900)+26);
  const tw=measure(c,tail,26,800);
  const total=lw+14+tw;
  keycap(c,-total/2, 0, null, label, lw);
  text(c,tail,-total/2+lw+14,-2,{size:26,weight:800,align:'left',fill:['#ffffff','#ffe9a3'],stroke:5});
  c.restore();
}

function drawScreens(c){
  const t=G.t;
  if(G.state==='title'){
    c.fillStyle='rgba(10,4,32,.44)'; c.fillRect(0,0,VW,VH);
    const s=E.outBack(clamp(G.stateT*1.1,0,1));
    c.save(); c.translate(VW/2, 196); c.scale(s,s);
    text(c,'STARBOUNCE',0,0,{size:104,fill:['#ffffff','#ffe27a','#ff9de2'],stroke:14,
      strokeColor:'rgba(40,10,80,.95)',shadowBlur:40,shadowY:10,letter:'2px'});
    c.restore();
    text(c,'Rescue as many star friends as you can in 90 seconds!',VW/2,272,
      {size:31,fill:['#d9f4ff','#8fd8ff'],stroke:6});
    bigZip(c,VW/2,382,50,t);
    for(let i=0;i<5;i++){
      const a=t*0.5+i*1.26;
      drawFuzzle(c, VW/2+Math.cos(a)*(180+i*15), 382+Math.sin(a*1.3)*48, 17,
                 (i*67)%360, i%4, t+i, .95);
    }
    pressHint(c,490,'SPACE','to play');
    if(save.best>0){
      text(c,`BEST ${save.best.toLocaleString('en-US')}   ·   ${save.bestRescued} FRIENDS IN ONE ROUND`,
        VW/2,548,{size:21,fill:'rgba(255,255,255,.85)',stroke:4});
    }
    return;
  }
  if(G.state==='over'){
    c.fillStyle='rgba(10,4,32,.55)'; c.fillRect(0,0,VW,VH);
    const s=E.outBack(clamp(G.stateT*1.5,0,1));
    const w=800,h=430, x=VW/2-w/2, y=VH/2-h/2-34;
    c.save(); c.translate(VW/2,y+h/2); c.scale(s,s); c.translate(-VW/2,-(y+h/2));
    panel(c,x,y,w,h,34,0.80);
    text(c,"TIME'S UP!", VW/2, y+62, {size:56, fill:['#ffffff','#ffe27a','#ff9d18'], stroke:9});
    for(let i=0;i<3;i++){
      const k=clamp((G.stateT-0.25-i*0.22)*3.2,0,1);
      const sc=E.outBack(k);
      if(k<=0){ miniStar(c, VW/2+(i-1)*104, y+156, 44, false, t, i); continue; }
      c.save(); c.translate(VW/2+(i-1)*104, y+156); c.scale(sc,sc);
      miniStar(c,0,0,44, i<G.resultStars, t, i);
      c.restore();
    }
    // headline number: friends rescued
    const rt = G.rescued+' rescued';
    const rw = measure(c, rt, 44, 900);
    const gap = 30, iconR = 22;
    const blockL = VW/2 - (rw + gap + iconR*2)/2;
    drawFuzzle(c, blockL + iconR, y+248, iconR, 190, 1, t*1.4, 1);
    text(c, rt, blockL + iconR*2 + gap, y+248,
      {size:44,align:'left',fill:['#ffffff','#9be7ff','#4fb8f0'],stroke:7});
    text(c,'SCORE  '+G.score.toLocaleString('en-US'), VW/2, y+312,
      {size:30,fill:['#ffffff','#ffd447'],stroke:5});
    if(G.newBest){
      const p=0.6+0.4*Math.sin(t*6);
      text(c,'NEW BEST!', VW/2, y+358, {size:28,fill:hsl(45,100,lerp(66,94,p)),stroke:5});
    } else {
      text(c,'TIP: '+TIPS[(G.rescued+G.shots)%TIPS.length], VW/2, y+358,
        {size:19,fill:'rgba(255,255,255,.82)',stroke:4});
    }
    c.restore();
    pressHint(c, y+h+50, 'SPACE', 'to play again');
    if(Math.random()<0.28) confettiBurst(rnd(VW*0.9,VW*0.1), -20, 3, {spd:120,g:260});
    return;
  }
}

  const w=1170,h=700,x=VW/2-w/2,y=VH/2-h/2;
  panel(c,x,y,w,h,30,0.94);
  text(c,'FOR GROWN-UPS',x+40,y+44,{size:33,align:'left',fill:['#ffffff','#ffd97a'],stroke:6});
  text(c,'Game paused — nothing is lost.',x+w-40,y+46,
    {size:19,align:'right',fill:'rgba(255,255,255,.72)',stroke:0,shadowBlur:6});
  c.strokeStyle='rgba(255,255,255,.18)'; c.lineWidth=2;
  c.beginPath(); c.moveTo(x+36,y+70); c.lineTo(x+w-36,y+70); c.stroke();

  const H=(s2,px,py)=>text(c,s2,px,py,{size:21,align:'left',fill:['#9be7ff','#5ab8ff'],stroke:0,shadowBlur:8,letter:'1px'});
  const P=(s2,px,py,alpha=.88)=>text(c,s2,px,py,{size:17.5,align:'left',weight:600,
      fill:`rgba(255,255,255,${alpha})`,stroke:0,shadowBlur:6});

  /* ---------- left column ---------- */
  let ly=y+108;
  H('WHAT THIS GAME IS',lx,ly); ly+=32;
  P('Zip is a little star-comet. Your child aims a cannon, sets its',lx,ly); ly+=24;
  P('power, and launches Zip in an arc to pop golden stars and free',lx,ly); ly+=24;
  P('the sky-friends inside. One round is 90 seconds — that is the',lx,ly); ly+=24;
  P('whole game. There are no levels and nothing to lose.',lx,ly); ly+=44;

  H('THE SKILLS IT BUILDS',lx,ly); ly+=32;
  const skills=[
    ['Trajectory prediction','Judging how an arc will curve under gravity — the',
     'core of throwing, catching and every ball sport.'],
    ['Angle of reflection','The candy walls, jelly blobs and rails all bounce Zip',
     'predictably, so "in equals out" is learned by feel, not by rule.'],
    ['Spatial planning','Choosing which star to aim for, and which surface to',
     'bank off to get there, is multi-step mental simulation.'],
    ['Fine motor control','Holding an arrow key for exactly the right fraction of',
     'a second to land an angle trains graded, precise input.']
  ];
  for(const s2 of skills){
    c.fillStyle='#ffd447'; c.beginPath(); c.arc(lx+6,ly-6,5,0,TAU); c.fill();
    text(c,s2[0],lx+22,ly-6,{size:18,align:'left',fill:'#ffd447',stroke:0,shadowBlur:6});
    P(s2[1],lx+22,ly+16,.80); P(s2[2],lx+22,ly+38,.80);
    ly+=68;
  }

  /* ---------- right column ---------- */
  let ry=y+108;
  H('CONTROLS  (keyboard only — no mouse)',rx,ry); ry+=34;
  const rows=[
    [['left','right'],null,'Aim the cannon left and right'],
    [['up','down'],null,'More power / less power'],
    [[],'SPACE','Launch Zip  ·  start or replay a round'],
    [[],'Q','Open and close this menu (pauses the game)']
  ];
  for(const r of rows){
    let kx=rx;
    for(const g of r[0]){ keycap(c,kx,ry+2,g,null,34); kx+=38; }
    if(r[1]) kx+=keycap(c,kx,ry+2,null,r[1])+4;
    P(r[2],kx+10,ry,.92);
    ry+=42;
  }
  ry+=10;

  H('HOW IT ADAPTS TO YOUR CHILD',rx,ry); ry+=32;
  P('A sparkling guide-path shows where Zip will fly. The game',rx,ry,.85); ry+=24;
  P('measures how well each shot was predicted and quietly',rx,ry,.85); ry+=24;
  P('SHORTENS that guide as accuracy grows — so the prediction',rx,ry,.85); ry+=24;
  P('moves off the screen and into their head. Miss a few and it',rx,ry,.85); ry+=24;
  P('grows back: the support is always there when it is needed.',rx,ry,.85); ry+=32;

  const pct=Math.round((1 - inv(0.42,2.30,G.guideT))*100);
  panel(c,rx,ry-6,colW,50,14,0.35);
  text(c,'Star Sense',rx+16,ry+18,{size:17,align:'left',fill:'rgba(255,255,255,.82)',stroke:0});
  for(let i=0;i<5;i++){
    const f=clamp(G.skill*5-i,0,1);
    const bx=rx+130+i*30;
    rrect(c,bx,ry+9,24,18,7); c.fillStyle='rgba(255,255,255,.15)'; c.fill();
    if(f>0){ c.save(); rrect(c,bx,ry+9,24,18,7); c.clip();
      c.fillStyle=hsl(lerp(190,300,i/4),100,66); c.fillRect(bx,ry+9,24*f,18); c.restore(); }
  }
  text(c,`guide reduced ${pct}%`,rx+colW-16,ry+18,
    {size:16,align:'right',fill:'rgba(255,255,255,.66)',stroke:0});
  ry+=64;

  H('SETTINGS   ( \u25b2 \u25bc choose  ·  SPACE toggle )',rx,ry); ry+=28;
  const opts=[
    ['Music', save.music?'ON':'OFF'],
    ['Sound effects', save.sfx?'ON':'OFF'],
    ['Reset best score & Star Sense', 'PRESS SPACE']
  ];
  for(let i=0;i<opts.length;i++){
    const sel=i===G.menuSel;
    const oy=ry+i*38;
    if(sel){
      rrect(c,rx-8,oy-2,colW+16,32,11);
      c.fillStyle=`rgba(255,212,71,${0.16+0.08*Math.sin(t*5)})`; c.fill();
      c.lineWidth=2; c.strokeStyle='rgba(255,212,71,.6)'; c.stroke();
      c.save(); c.translate(rx-24,oy+14); c.fillStyle='#ffd447';
      c.beginPath(); c.moveTo(7,0); c.lineTo(-4,-7); c.lineTo(-4,7); c.closePath(); c.fill(); c.restore();
    }
    text(c,opts[i][0],rx+8,oy+14,{size:18,align:'left',
      fill:sel?'#ffffff':'rgba(255,255,255,.78)',stroke:0,shadowBlur:6});
    text(c,opts[i][1],rx+colW-8,oy+14,{size:18,align:'right',
      fill:sel?'#ffd447':'rgba(255,255,255,.58)',stroke:0,shadowBlur:6});
  }

  const pulse=0.55+0.45*Math.sin(t*4);
  text(c,'Press  Q  to close and jump right back in',VW/2,y+h-28,
    {size:22,fill:['#ffffff',hsl(45,100,lerp(70,92,pulse))],stroke:5});
}

/* ================================================================== 15. MAIN LOOP ======= */
/* Physics uses a clamped dt so a stutter can never tunnel Zip through a wall. The round
   clock uses the *real* elapsed time instead, so "90 seconds" means 90 seconds even on a
   slow machine. Long stalls (tab switches) are capped so nobody loses their round. */
let last=0, fpsAcc=0, fpsN=0;
window.__fps=60;
function loop(now){
  requestAnimationFrame(loop);
  if(!last) last=now;
  const raw=(now-last)/1000; last=now;
  if(raw>0){ fpsAcc+=1/raw; fpsN++; if(fpsN>=30){ window.__fps=fpsAcc/fpsN; fpsAcc=0; fpsN=0; } }
  const dt = Math.min(raw, 0.05);        // physics step
  const clockDt = Math.min(raw, 0.25);   // round clock step
  if(G.paused){ SKY.update(dt*0.25); G.t+=dt*0.25; updateParticles(dt*0.25); }
  else updateGame(dt, clockDt);
  const t0=performance.now();
  render();
  qualityTick(performance.now()-t0);
}
function render(){
  const c=ctx;
  c.setTransform(RS,0,0,RS,0,0);
  c.globalAlpha=1; c.globalCompositeOperation='source-over';
  SKY.draw(c, G.fever);
  c.save(); c.translate(G.shakeX,G.shakeY);
  drawWorld(c,false);
  c.restore();
  renderBloom();
  vignette(c);
  drawHUD(c);
  drawScreens(c);
  if(G.paused) drawParentMenu(c);
}

/* ================================================================== 16. BOOT ============ */
SPR.init();
SKY.init();
/* the title screen shows a live arena behind it, so the child sees the toy before playing */
G.world = genArena((Math.random()*0xffffffff)>>>0);
for(let i=0;i<STAR_COUNT;i++) spawnStar();
setState('title');
G.lastSkillPips = Math.round(G.skill*5);
window.__G = G; window.__SND = SND;
requestAnimationFrame(loop);
setTimeout(()=>{ const b=document.getElementById('boot'); if(b) b.classList.add('hide');
  setTimeout(()=>b && b.remove(), 600); }, 380);
</script>
