<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>STARBOUNCE — Zip's Sky Rescue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='38%25' cy='32%25'%3E%3Cstop offset='0' stop-color='%23fffdf2'/%3E%3Cstop offset='.45' stop-color='%23ffdc4a'/%3E%3Cstop offset='1' stop-color='%23f2652b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' stroke='%23341250' stroke-width='2.5' stroke-linejoin='round' d='M16 2l3.8 8.6 9.2 1-6.9 6.3 2 9.1L16 22.4 7.9 27l2-9.1L3 11.6l9.2-1z'/%3E%3Ccircle cx='12.6' cy='15' r='1.7' fill='%23341250'/%3E%3Ccircle cx='19.4' cy='15' r='1.7' fill='%23341250'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#08061a;
    font-family: "Segoe UI Variable Display","Segoe UI Rounded","SF Pro Rounded","Nunito",
                 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #stage {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 100% at 50% 0%,   #241a55 0%, #140f36 45%, #08061a 100%);
  }
  /* Arcade bezel: neutral elevation only — every colour on screen comes from the game. */
  canvas#game {
    display:block; border-radius:22px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.14),
      0 2px 4px rgba(0,0,0,.4),
      0 12px 24px rgba(0,0,0,.45),
      0 40px 72px -16px rgba(0,0,0,.7);
    image-rendering:auto;
  }
  #boot {
    position:fixed; inset:0; display:flex; flex-direction:column; gap:18px;
    align-items:center; justify-content:center; color:#fff; z-index:9;
    background:radial-gradient(120% 100% at 50% 0%, #2a1f63 0%, #120d2f 55%, #08061a 100%);
    transition:opacity .5s ease; font-weight:800; letter-spacing:.02em;
  }
  #boot.hide { opacity:0; pointer-events:none; }
  #boot .t { font-size:clamp(28px,6vw,64px);
    background:linear-gradient(180deg,#fff 10%,#ffd76a 55%,#ff9de2 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 3px 2px rgba(0,0,0,.5)); }
  #boot .s { font-size:clamp(13px,2.2vw,19px); opacity:.75; font-weight:700; }
  .spin { width:46px; height:46px; border-radius:50%;
    border:5px solid rgba(255,255,255,.15); border-top-color:#ffd76a;
    animation:sp 900ms linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="stage"><canvas id="game" aria-label="Starbounce game"></canvas></div>
<div id="boot"><div class="t">STARBOUNCE</div><div class="spin"></div><div class="s">warming up the sky…</div></div>

<script>
"use strict";
/* =========================================================================================
   STARBOUNCE — Zip's Sky Rescue
   A single-file, zero-dependency arcade game for ~8 year olds.
   Core skill: trajectory prediction + angle-of-reflection (spatial reasoning & fine motor).
   Everything (art, sound, levels) is generated procedurally at runtime.
   ========================================================================================= */

/* ------------------------------------------------------------------ 0. CONSTANTS ------ */
/* --- fixed vertical layout (VH=800) -----------------------------------------------------
   0..78     HUD header panel
   88        CEIL   — bouncy ceiling
   120..450  star field
   672       cannon
   742       FLOOR  — the shot ends here
   758..798  control hint bar
   --------------------------------------------------------------------------------------- */
const VW = 1280, VH = 800;              // virtual/logical resolution — all game code uses this
const WALL = 26;                        // playfield inset from left/right
const CEIL = 88;                        // bouncy ceiling (sits just under the HUD header)
const FLOOR = 742;                      // y where a hop is lost
const GLOW_DIV = 3;                     // bloom buffer divisor

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d', { alpha:false, desynchronized:true });
let RS = 1;                             // render scale (css scale * dpr)

/* Bloom pyramid: the world's emissive pass is rendered small, then downsampled twice.
   Upscaling those tiny buffers with bilinear filtering gives a smooth, very cheap glow —
   far faster than a real gaussian `filter: blur()` on every frame. */
const glowCvs = offscreenEarly(Math.ceil(VW/GLOW_DIV), Math.ceil(VH/GLOW_DIV));
const gctx = glowCvs.getContext('2d');
const bloomA = offscreenEarly(Math.ceil(VW/(GLOW_DIV*2)), Math.ceil(VH/(GLOW_DIV*2)));
const actx = bloomA.getContext('2d');
const bloomB = offscreenEarly(Math.ceil(VW/(GLOW_DIV*4)), Math.ceil(VH/(GLOW_DIV*4)));
const bctx = bloomB.getContext('2d');
for(const x of [gctx,actx,bctx]) x.imageSmoothingQuality='low';

function offscreenEarly(w,h){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h));
  return c;
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pad = window.innerWidth < 700 ? 0 : 18;
  const aw = Math.max(320, window.innerWidth  - pad);
  const ah = Math.max(240, window.innerHeight - pad);
  const s  = Math.min(aw / VW, ah / VH);
  cvs.style.width  = (VW * s) + 'px';
  cvs.style.height = (VH * s) + 'px';
  const bw = Math.round(VW * s * dpr), bh = Math.round(VH * s * dpr);
  if (cvs.width !== bw || cvs.height !== bh){ cvs.width = bw; cvs.height = bh; }
  RS = s * dpr;
}
addEventListener('resize', resize, { passive:true });
resize();

/* ------------------------------------------------------------------ 1. UTILITIES ------ */
const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b - a) * t;
const inv   = (a,b,v) => (v - a) / (b - a || 1);
const rnd   = (a=1,b=0) => b + Math.random() * (a - b);
const rndi  = (a,b) => Math.floor(rnd(a,b));
const pick  = arr => arr[(Math.random() * arr.length) | 0];
const dist2 = (x1,y1,x2,y2) => { const dx=x2-x1, dy=y2-y1; return dx*dx+dy*dy; };
const approach = (v,t,d) => v < t ? Math.min(v+d,t) : Math.max(v-d,t);

// deterministic RNG (mulberry32) for reproducible procedural levels
function makeRng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// easing
const E = {
  outCubic : t => 1 - Math.pow(1-t, 3),
  inCubic  : t => t*t*t,
  outQuint : t => 1 - Math.pow(1-t, 5),
  inOutCubic:t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  outBack  : t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); },
  outElastic:t => { if(t===0||t===1) return t; const c4=TAU/3;
                    return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1; },
  outBounce: t => { const n=7.5625,d=2.75;
    if(t<1/d) return n*t*t; if(t<2/d) return n*(t-=1.5/d)*t+.75;
    if(t<2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; },
  inOutSine: t => -(Math.cos(Math.PI*t)-1)/2
};

function hsl(h,s,l,a=1){ return `hsla(${h},${s}%,${l}%,${a})`; }

/* rounded-rect path (Safari-safe) */
function rrect(c,x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

/* star polygon path */
function starPath(c,x,y,r1,r2,points,rot=0){
  c.beginPath();
  for(let i=0;i<points*2;i++){
    const a = rot + i*Math.PI/points, r = i%2 ? r2 : r1;
    const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
    i ? c.lineTo(px,py) : c.moveTo(px,py);
  }
  c.closePath();
}

/* chunky readable text with outline + shadow. `fill` can be a color or [c0,c1] gradient */
function text(c, str, x, y, o={}){
  const size = o.size||32, weight = o.weight||900;
  c.save();
  c.font = `${weight} ${size}px "Segoe UI Variable Display","Segoe UI Rounded","SF Pro Rounded",system-ui,sans-serif`;
  c.textAlign = o.align||'center';
  c.textBaseline = o.base||'middle';
  if(o.letter) c.letterSpacing = o.letter;
  if(o.shadow !== false){
    c.shadowColor = o.shadowColor || 'rgba(6,4,24,.75)';
    c.shadowBlur = o.shadowBlur ?? size*0.5;
    c.shadowOffsetY = o.shadowY ?? size*0.10;
  }
  const sw = o.stroke ?? Math.max(3, size*0.16);
  if(sw > 0){
    c.lineWidth = sw*2; c.lineJoin='round'; c.miterLimit=2;
    c.strokeStyle = o.strokeColor || 'rgba(20,10,52,.92)';
    c.strokeText(str,x,y);
  }
  c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  let fill = o.fill || '#fff';
  if(Array.isArray(fill)){
    const g = c.createLinearGradient(0,y-size*0.62,0,y+size*0.62);
    for(let i=0;i<fill.length;i++) g.addColorStop(i/(fill.length-1), fill[i]);
    fill = g;
  }
  c.fillStyle = fill;
  c.fillText(str,x,y);
  c.restore();
  return c.measureText ? 0 : 0;
}
function measure(c,str,size,weight=900){
  const k=str+'|'+size+'|'+weight;
  let v=measure.cache.get(k);
  if(v!==undefined) return v;
  c.save();
  c.font=`${weight} ${size}px "Segoe UI Variable Display","Segoe UI Rounded",system-ui,sans-serif`;
  v=c.measureText(str).width; c.restore();
  measure.cache.set(k,v);
  return v;
}
measure.cache = new Map();

/* ------------------------------------------------------------------ 2. AUDIO ---------- */
/* Everything synthesised. Warm, cheerful, pentatonic — nothing can sound "wrong". */
const SND = {
  ac:null, master:null, sfx:null, music:null, verb:null, comp:null,
  ready:false, sfxOn:true, musicOn:true,
  penta:[523.25, 587.33, 659.25, 783.99, 880.00],   // C D E G A (major pentatonic)

  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = this.ac = new AC();
    this.comp = ac.createDynamicsCompressor();
    this.comp.threshold.value=-14; this.comp.knee.value=26; this.comp.ratio.value=5;
    this.comp.attack.value=.004; this.comp.release.value=.20;
    this.master = ac.createGain(); this.master.gain.value = 0.85;
    this.sfx    = ac.createGain(); this.sfx.gain.value    = 0.85;
    this.music  = ac.createGain(); this.music.gain.value  = 0.0;
    this.verb   = ac.createConvolver(); this.verb.buffer  = this._impulse(2.0, 2.6);
    const wet = ac.createGain(); wet.gain.value = 0.30;
    this.wet = wet;
    this.sfx.connect(this.comp); this.music.connect(this.comp);
    this.sfx.connect(wet); this.music.connect(wet); wet.connect(this.verb);
    this.verb.connect(this.comp);
    this.comp.connect(this.master); this.master.connect(ac.destination);
    this.ready = true;
    this._startMusic();
  },
  resume(){ if(this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  _impulse(dur, decay){
    const ac=this.ac, rate=ac.sampleRate, len=(rate*dur)|0;
    const buf=ac.createBuffer(2,len,rate);
    for(let ch=0; ch<2; ch++){
      const d=buf.getChannelData(ch);
      for(let i=0;i<len;i++){
        const t=i/len;
        d[i] = (Math.random()*2-1) * Math.pow(1-t, decay) * (1 - t*0.15);
      }
    }
    return buf;
  },
  _env(node, t, a, d, peak){
    const g=node.gain; g.cancelScheduledValues(t);
    g.setValueAtTime(0.0001,t);
    g.exponentialRampToValueAtTime(Math.max(peak,0.0002), t+a);
    g.exponentialRampToValueAtTime(0.0001, t+a+d);
  },
  tone(freq, {type='sine', t=0, a=.006, d=.25, gain=.25, dest=null, detune=0, slide=0, pan=0}={}){
    if(!this.ready || !this.sfxOn) return;
    const ac=this.ac, now=ac.currentTime + t;
    const o=ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq, now);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide), now+a+d);
    o.detune.value=detune;
    const g=ac.createGain(); this._env(g, now, a, d, gain);
    let out = g;
    if(pan && ac.createStereoPanner){ const p=ac.createStereoPanner(); p.pan.value=clamp(pan,-1,1); g.connect(p); out=p; }
    o.connect(g); out.connect(dest || this.sfx);
    o.start(now); o.stop(now + a + d + .05);
  },
  noise(dur=.2, {t=0, gain=.2, type='highpass', f=1200, q=1, dest=null, sweep=0}={}){
    if(!this.ready || !this.sfxOn) return;
    const ac=this.ac, now=ac.currentTime+t, len=Math.max(1,(ac.sampleRate*dur)|0);
    const buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=ac.createBufferSource(); src.buffer=buf;
    const flt=ac.createBiquadFilter(); flt.type=type; flt.frequency.setValueAtTime(f,now); flt.Q.value=q;
    if(sweep) flt.frequency.exponentialRampToValueAtTime(Math.max(60,f*sweep), now+dur);
    const g=ac.createGain(); this._env(g, now, .005, dur, gain);
    src.connect(flt); flt.connect(g); g.connect(dest||this.sfx);
    src.start(now); src.stop(now+dur+.05);
  },
  /* --- game sounds --- */
  pop(combo=0, kind=0){
    const oct = Math.floor(combo/5), idx = combo%5;
    const f = this.penta[idx] * Math.pow(2, Math.min(oct,2)) * (kind? 1 : 0.5);
    const pan = clamp((this._panX-0.5)*1.4, -1, 1);
    this.tone(f,      {type:'triangle', gain:.20, a:.004, d:.30, pan});
    this.tone(f*2,    {type:'sine',     gain:.10, a:.003, d:.16, pan});
    this.tone(f*3,    {type:'sine',     gain:.045,a:.003, d:.10, pan});
    this.noise(.10,   {gain:.055, f:3200, sweep:.5});
  },
  _panX:0.5,
  bounce(power=1){
    const f = 190 + power*180;
    this.tone(f,   {type:'sine', gain:.20*clamp(power,.3,1.3), a:.003, d:.13, slide:.55});
    this.noise(.05,{gain:.05, f:900, sweep:.4});
  },
  rail(){
    this.tone(660,{type:'triangle',gain:.14,a:.002,d:.12,slide:1.5});
    this.tone(990,{type:'sine',gain:.07,a:.002,d:.09,slide:1.4});
  },
  launch(power){
    this.noise(.34,{gain:.16, type:'bandpass', f:420, q:1.2, sweep:4.2});
    this.tone(180+power*140,{type:'triangle',gain:.13,a:.01,d:.30,slide:2.6});
  },
  aim(){ this.tone(880,{type:'sine',gain:.030,a:.002,d:.05}); },
  catchBall(){
    [0,1,2,4].forEach((n,i)=> this.tone(this.penta[n]*2,{type:'triangle',gain:.15,a:.004,d:.22,t:i*0.055}));
    this.noise(.3,{gain:.07,f:4000,t:.02,sweep:.7});
  },
  fanfare(){
    const s=[523.25,659.25,783.99,1046.5,1318.5];
    s.forEach((f,i)=>{
      this.tone(f,{type:'triangle',gain:.22,a:.006,d:.55,t:i*.085});
      this.tone(f*2,{type:'sine',gain:.09,a:.006,d:.40,t:i*.085});
    });
    this.noise(.7,{gain:.10,f:5200,t:.1,sweep:.5});
  },
  cheer(){
    [392,523.25,659.25].forEach((f,i)=>{
      this.tone(f,{type:'triangle',gain:.20,a:.008,d:.45,t:i*.12});
    });
  },
  warm(){ // gentle "try again" — warm, never harsh
    [659.25,587.33,523.25].forEach((f,i)=> this.tone(f,{type:'sine',gain:.18,a:.01,d:.50,t:i*.16}));
  },
  ui(up=true){ this.tone(up?740:560,{type:'triangle',gain:.11,a:.003,d:.11}); },
  fuzzle(){ this.tone(rnd(1500,900),{type:'sine',gain:.07,a:.004,d:.18,slide:1.6}); },
  star(){
    this.tone(1318.5,{type:'triangle',gain:.16,a:.003,d:.35});
    this.tone(1975.5,{type:'sine',gain:.08,a:.003,d:.28,t:.06});
    this.noise(.25,{gain:.07,f:6000,sweep:.6});
  },

  /* --- gentle background music: I–V–vi–IV in C, soft arpeggio + pad + bass --- */
  _startMusic(){
    const ac=this.ac;
    this.mFilter = ac.createBiquadFilter();
    this.mFilter.type='lowpass'; this.mFilter.frequency.value=2400; this.mFilter.Q.value=.4;
    this.mFilter.connect(this.music);
    this.step=0; this.nextT=ac.currentTime + .2; this.tempo=104; this.fever=0;
    this._sched = setInterval(()=>this._pump(), 30);
    this.setMusic(this.musicOn);
  },
  setMusic(on){
    this.musicOn=on;
    if(this.music) this.music.gain.setTargetAtTime(on?0.30:0.0, this.ac.currentTime, .25);
  },
  setSfx(on){ this.sfxOn=on; },
  _pump(){
    if(!this.ready) return;
    const ac=this.ac, spb = 60/(this.tempo*(1+this.fever*0.18))/2; // eighth notes
    while(this.nextT < ac.currentTime + .18){
      this._note(this.nextT, this.step);
      this.nextT += spb; this.step++;
    }
  },
  _note(t, s){
    if(!this.musicOn) return;
    const chords=[[261.63,329.63,392.00],[196.00,246.94,392.00],[220.00,261.63,329.63],[174.61,220.00,261.63]];
    const bar = Math.floor(s/8) % 4, ch = chords[bar];
    const patt = [0,1,2,1,0,2,1,2];
    const f = ch[patt[s%8]] * 2;
    const ac=this.ac;
    const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=f;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.075 + this.fever*0.03, t+.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+.42);
    o.connect(g); g.connect(this.mFilter); o.start(t); o.stop(t+.5);
    if(s%8===0){ // bass
      const b=ac.createOscillator(); b.type='sine'; b.frequency.value=ch[0]/2;
      const bg=ac.createGain();
      bg.gain.setValueAtTime(0.0001,t);
      bg.gain.exponentialRampToValueAtTime(0.13,t+.02);
      bg.gain.exponentialRampToValueAtTime(0.0001,t+1.05);
      b.connect(bg); bg.connect(this.mFilter); b.start(t); b.stop(t+1.2);
    }
    if(this.fever>0 && s%2===1){ // sparkle layer during fever
      const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
      const g2=ac.createGain();
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.035*this.fever,t+.01);
      g2.gain.exponentialRampToValueAtTime(0.0001,t+.22);
      o2.connect(g2); g2.connect(this.mFilter); o2.start(t); o2.stop(t+.3);
    }
  }
};

/* ------------------------------------------------------------------ 3. PARTICLES ------ */
/* Compact pool: active particles always occupy [0, nActive) so update/draw is O(active). */
const MAXP = 1200;
class Particle {
  constructor(){ this.alive=false; }
  reset(o){
    this.alive=true;
    this.kind=o.kind||'spark';
    this.x=o.x; this.y=o.y;
    this.vx=o.vx||0; this.vy=o.vy||0;
    this.g=o.g??900; this.drag=o.drag??0.995;
    this.life=o.life||0.7; this.t=0;
    this.r=o.r||4; this.r2=o.r2||this.r;
    this.h=o.h??50; this.s=o.s??100; this.l=o.l??65;
    this.rot=o.rot||0; this.vr=o.vr||0;
    this.add=o.add!==false;
    this.txt=o.txt||null; this.size=o.size||30;
    this.fade=o.fade??1;
    return this;
  }
}
const pool = new Array(MAXP); for(let i=0;i<MAXP;i++) pool[i]=new Particle();
let nActive = 0;
function emit(o){
  if(nActive >= MAXP) nActive = MAXP-1;      // oldest slot recycles under extreme load
  return pool[nActive++].reset(o);
}
function updateParticles(dt){
  for(let i=0;i<nActive;i++){
    const p=pool[i];
    p.t+=dt;
    if(p.t>=p.life){
      p.alive=false;
      const last=pool[--nActive]; pool[nActive]=p; pool[i]=last;
      i--; continue;
    }
    p.vy += p.g*dt;
    const d=Math.pow(p.drag, dt*60);
    p.vx *= d; p.vy *= d;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += p.vr*dt;
  }
}
function drawParticles(c, glow){
  if(nActive===0) return;
  const prev=c.globalCompositeOperation;
  /* Batched in two passes so the composite mode is set twice per frame instead of
     once per particle — state flips dominate the cost when the screen gets busy. */
  for(let pass=0; pass<2; pass++){
    const add = pass===0;
    if(glow && !add) break;
    c.globalCompositeOperation = add ? 'lighter' : 'source-over';
    for(let i=0;i<nActive;i++){
      const p=pool[i];
      if(p.add!==add) continue;
      const k = p.t/p.life, a = Math.pow(1-k, p.fade);
      switch(p.kind){
        case 'spark': {
          const r = p.r*(1 - k*0.55) * (glow?1.5:1);
          drawDot(c,p.x,p.y,r*2.6,p.h,a);
          break;
        }
        case 'confetti': {
          c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
          const w=p.r*2, h=p.r*(1.1+Math.abs(Math.sin(p.rot*1.7))*1.4);
          c.fillStyle=hsl(p.h,p.s,p.l,a);
          rrect(c,-w/2,-h/2,w,h,Math.min(w,h)*0.35); c.fill();
          c.restore(); break;
        }
        case 'ring': {
          const r = lerp(p.r, p.r2, E.outCubic(k));
          c.strokeStyle = hsl(p.h,p.s,p.l,a*0.9);
          c.lineWidth = Math.max(1, p.size*(1-k));
          c.beginPath(); c.arc(p.x,p.y,r,0,TAU); c.stroke();
          break;
        }
        case 'puff': {
          const r=lerp(p.r,p.r2,E.outCubic(k));
          drawDot(c,p.x,p.y,r,p.h,a*0.42);
          break;
        }
        case 'star': {
          const r=p.r*(1-k*.35)*(glow?1.3:1);
          c.save(); c.translate(p.x,p.y); c.rotate(p.rot);
          c.fillStyle=hsl(p.h,p.s,Math.min(95,p.l+18),a);
          starPath(c,0,0,r,r*0.42,5,-Math.PI/2); c.fill();
          c.restore(); break;
        }
        case 'text': {
          if(glow) break;
          const up = -70*E.outCubic(k);
          const sc = E.outBack(Math.min(1,k*4)) * (1 + k*0.12);
          c.save(); c.translate(p.x, p.y+up); c.scale(sc,sc);
          text(c,p.txt,0,0,{size:p.size, fill:[ '#fff', hsl(p.h,p.s,p.l) ],
                            stroke:p.size*0.17, strokeColor:'rgba(40,14,80,'+a+')'});
          c.restore();
          break;
        }
      }
    }
  }
  c.globalCompositeOperation=prev;
  c.globalAlpha=1;
}

/* Adaptive quality: FX scales every burst, and heavy frames drop the particle glow pass.
   Kids' machines vary wildly — the game degrades gracefully instead of stuttering. */
const QUAL = { fx:1, particleGlow:true, ema:16.7 };
function qualityTick(frameMs){
  QUAL.ema = QUAL.ema*0.92 + frameMs*0.08;
  if(QUAL.ema > 26){ QUAL.fx = Math.max(0.35, QUAL.fx-0.05); QUAL.particleGlow=false; }
  else if(QUAL.ema < 17){ QUAL.fx = Math.min(1, QUAL.fx+0.02);
    if(QUAL.ema < 13) QUAL.particleGlow=true; }
}

/* burst helpers */
function burst(x,y,n,hue,opts={}){
  n = Math.max(3, Math.round(n*QUAL.fx));
  const spd=opts.spd||420, spread=opts.spread||TAU, dir=opts.dir??0;
  for(let i=0;i<n;i++){
    const a = dir + (Math.random()-.5)*spread;
    const s = spd*rnd(1.1,.25);
    emit({kind: Math.random()<.28?'star':'spark', x,y,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      g:opts.g??520, drag:.955, life:rnd(.85,.35),
      r:rnd(9,4), h:hue+rnd(28,-28), s:100, l:rnd(80,58),
      rot:rnd(TAU), vr:rnd(9,-9)});
  }
}
function confettiBurst(x,y,n,opts={}){
  n = Math.max(3, Math.round(n*QUAL.fx));
  for(let i=0;i<n;i++){
    const a=-Math.PI/2 + rnd(1.5,-1.5);
    const s=(opts.spd||620)*rnd(1.2,.35);
    emit({kind:'confetti', x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      g:opts.g??820, drag:.985, life:rnd(2.3,1.2), r:rnd(9,5),
      h:rnd(360), s:92, l:rnd(72,55), rot:rnd(TAU), vr:rnd(11,-11), add:false, fade:.6});
  }
}
function popText(x,y,str,hue=45,size=38){
  emit({kind:'text',x,y,txt:str,size,h:hue,s:100,l:65,life:.95,g:0,vx:0,vy:0,add:false});
}
</script>
<script>
"use strict";
/* ================================================================== 4. SKY / BACKDROP == */
/* Pre-baked procedural sprites so the per-frame cost stays tiny. */

function offscreen(w,h){
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h));
  return c;
}

/* ---------------------------------------------------------------------------------------
   SPRITE BAKERY — every gradient-heavy visual is rendered once into an offscreen canvas
   and then blitted. This is what keeps the frame budget healthy when the screen is busy.
   --------------------------------------------------------------------------------------- */
const SPR = {
  DOTN:24, DOTS:96, dots:[], bubbles:new Map(), stars:[], bumpers:new Map(),
  wallV:null, wallH:null, field:null,
  init(){
    for(let i=0;i<this.DOTN;i++) this.dots.push(this._dot(i*(360/this.DOTN)));
    for(let i=0;i<12;i++) this.stars.push(this._star(i*30));
  },
  _dot(h){
    const S=this.DOTS, c=offscreen(S,S), x=c.getContext('2d'), r=S/2;
    const g=x.createRadialGradient(r,r,0,r,r,r);
    g.addColorStop(0,   hsl(h,100,98,1));
    g.addColorStop(.16, hsl(h,100,86,.95));
    g.addColorStop(.40, hsl(h,100,68,.42));
    g.addColorStop(.72, hsl(h,100,62,.10));
    g.addColorStop(1,   hsl(h,100,60,0));
    x.fillStyle=g; x.fillRect(0,0,S,S);
    return c;
  },
  dot(h){ const n=this.DOTN; return this.dots[((Math.round(h/(360/n))%n)+n)%n]; },

  /* glass orb holding a sleeping fuzzle — baked at a canonical radius, scaled when drawn */
  BR:34,
  bubble(hue,variant){
    const key=hue+'|'+variant;
    let s=this.bubbles.get(key); if(s) return s;
    const R=this.BR, S=Math.ceil(R*3.2), c=offscreen(S,S), x=c.getContext('2d');
    const cx=S/2, cy=S/2, h=hue;
    x.globalCompositeOperation='lighter';
    const og=x.createRadialGradient(cx,cy,R*.6,cx,cy,R*1.55);
    og.addColorStop(0,hsl(h,95,62,.34)); og.addColorStop(1,hsl(h,95,62,0));
    x.fillStyle=og; x.beginPath(); x.arc(cx,cy,R*1.55,0,TAU); x.fill();
    x.globalCompositeOperation='source-over';
    const g=x.createRadialGradient(cx-R*.36,cy-R*.42,R*.06, cx,cy,R*1.06);
    g.addColorStop(0,   hsl(h,100,96,.99));
    g.addColorStop(.20, hsl(h,96,80,.94));
    g.addColorStop(.62, hsl(h,92,60,.86));
    g.addColorStop(.90, hsl(h+16,90,46,.92));
    g.addColorStop(1,   hsl(h+24,88,40,.98));
    x.fillStyle=g; x.beginPath(); x.arc(cx,cy,R,0,TAU); x.fill();
    x.save(); x.beginPath(); x.arc(cx,cy,R*.99,0,TAU); x.clip();
    x.globalAlpha=.30;
    for(let i=0;i<2;i++){
      x.beginPath();
      x.ellipse(cx+Math.cos(i*2.3)*R*.22, cy+Math.sin(i*2.3)*R*.22, R*.62, R*.30, i*2.3, 0, TAU);
      x.fillStyle=hsl(h-24,100,88,.55); x.fill();
    }
    x.restore();
    drawFuzzle(x, cx, cy+R*0.10, R*0.56, (h+150)%360, variant, 1.2, 0.92);
    x.lineWidth=Math.max(2,R*0.13); x.strokeStyle=hsl(h-18,100,94,.6);
    x.beginPath(); x.arc(cx,cy,R*.92, Math.PI*0.15, Math.PI*0.95); x.stroke();
    const s1=x.createRadialGradient(cx-R*.40,cy-R*.46,0,cx-R*.40,cy-R*.46,R*.42);
    s1.addColorStop(0,'rgba(255,255,255,.97)'); s1.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=s1; x.beginPath(); x.ellipse(cx-R*.36,cy-R*.42,R*.34,R*.26,-0.5,0,TAU); x.fill();
    x.fillStyle='rgba(255,255,255,.8)';
    x.beginPath(); x.ellipse(cx+R*.42,cy+R*.40,R*.12,R*.09,0.6,0,TAU); x.fill();
    this.bubbles.set(key,c);
    return c;
  },

  /* rainbow rescue star — reads as a bold gold star; the hue only shimmers on the rim */
  SR:44,
  _star(h){
    const R=this.SR, S=Math.ceil(R*4.6), c=offscreen(S,S), x=c.getContext('2d');
    const cx=S/2, cy=S/2;
    x.globalCompositeOperation='lighter';
    const og=x.createRadialGradient(cx,cy,R*.5,cx,cy,R*2.1);
    og.addColorStop(0,hsl(h,100,66,.20)); og.addColorStop(.5,hsl(44,100,62,.10));
    og.addColorStop(1,hsl(h,100,60,0));
    x.fillStyle=og; x.beginPath(); x.arc(cx,cy,R*2.1,0,TAU); x.fill();
    x.save(); x.translate(cx,cy);
    for(let i=0;i<2;i++){
      x.rotate(Math.PI/2);
      const lg=x.createLinearGradient(-R*2.0,0,R*2.0,0);
      lg.addColorStop(0,'rgba(255,255,255,0)');
      lg.addColorStop(.5,`hsla(${h},100%,88%,.5)`);
      lg.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=lg; x.fillRect(-R*2.0,-R*.05,R*4.0,R*.10);
    }
    x.restore();
    x.globalCompositeOperation='source-over';
    x.save(); x.translate(cx,cy);
    // dark contour so the star never dissolves into the purple sky
    starPath(x,0,0,R*1.20,R*0.55,5,-Math.PI/2);
    x.lineWidth=R*0.40; x.lineJoin='round'; x.strokeStyle='rgba(52,12,78,.92)'; x.stroke();
    // candy-gold shell
    const g=x.createLinearGradient(0,-R*1.2,0,R*1.2);
    g.addColorStop(0,  '#fff3b0');
    g.addColorStop(.24,'#ffdc4a');
    g.addColorStop(.55,'#ffb300');
    g.addColorStop(.82,'#ff8207');
    g.addColorStop(1,  '#e2530a');
    x.fillStyle=g; x.fill();
    // hue-tinted inner rim: the rainbow shimmer, kept thin so gold stays dominant
    x.lineWidth=R*0.09; x.strokeStyle=hsl(h,100,80,.85); x.stroke();
    // white facet + top gloss
    starPath(x,0,0,R*0.60,R*0.25,5,-Math.PI/2);
    x.fillStyle='rgba(255,255,255,.28)'; x.fill();
    x.beginPath(); x.ellipse(-R*0.18,-R*0.54,R*0.28,R*0.14,-0.5,0,TAU);
    x.fillStyle='rgba(255,255,255,.7)'; x.fill();
    x.restore();
    drawFace(x,cx,cy+R*0.12,R*0.50,0.4,'happy');
    return c;
  },
  star(h){ return this.stars[((Math.round(h/30)%12)+12)%12]; },

  bumper(hue){
    let s=this.bumpers.get(hue); if(s) return s;
    const R=42, S=Math.ceil(R*2.7), c=offscreen(S,S), x=c.getContext('2d');
    const cx=S/2, cy=S/2;
    x.fillStyle='rgba(20,8,44,.35)';
    x.beginPath(); x.ellipse(cx,cy+R*0.24,R*1.04,R*1.0,0,0,TAU); x.fill();
    // bold contour reads instantly as "solid bouncy thing", never as a poppable bubble
    x.beginPath(); x.arc(cx,cy,R,0,TAU);
    x.lineWidth=R*0.20; x.strokeStyle='rgba(40,12,68,.95)'; x.stroke();
    const g=x.createRadialGradient(cx-R*.32,cy-R*.38,R*.05,cx,cy,R*1.05);
    g.addColorStop(0,hsl(hue,100,94)); g.addColorStop(.3,hsl(hue,96,76));
    g.addColorStop(.75,hsl(hue,90,52)); g.addColorStop(1,hsl(hue+18,88,36));
    x.fillStyle=g; x.fill();
    // chunky pinwheel wedges — unmistakably a springy bumper
    x.save(); x.beginPath(); x.arc(cx,cy,R*0.99,0,TAU); x.clip();
    x.translate(cx,cy);
    for(let i=0;i<6;i++){
      x.beginPath(); x.moveTo(0,0);
      x.arc(0,0,R, i*TAU/6, i*TAU/6+TAU/12);
      x.closePath();
      x.fillStyle='rgba(255,255,255,.34)'; x.fill();
    }
    x.restore();
    // spring rings
    x.beginPath(); x.arc(cx,cy,R*0.70,0,TAU);
    x.lineWidth=R*0.15; x.strokeStyle=hsl(hue,100,97,.9); x.stroke();
    x.beginPath(); x.arc(cx,cy,R*0.70,0,TAU);
    x.lineWidth=R*0.05; x.strokeStyle='rgba(40,12,68,.45)'; x.stroke();
    x.fillStyle='rgba(255,255,255,.9)';
    x.beginPath(); x.ellipse(cx-R*.36,cy-R*.44,R*.20,R*.13,-0.5,0,TAU); x.fill();
    this.bumpers.set(hue,c);
    return c;
  }
};
function drawDot(c,x,y,r,h,a){
  if(a<=0.004||r<=0.2) return;
  c.globalAlpha=a;
  c.drawImage(SPR.dot(h), x-r, y-r, r*2, r*2);
  c.globalAlpha=1;
}


/* --- fluffy cloud sprite: overlapping soft lobes + top light + bottom shade --- */
function makeCloud(w,h,seed,tint=[210,60]){
  const c=offscreen(w,h), x=c.getContext('2d'), R=makeRng(seed);
  const lobes=[];
  const n=6+((R()*4)|0);
  const maxR=h*0.30;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const r = maxR*(0.62 + Math.sin(t*Math.PI)*0.38)*(0.88+R()*0.22);
    lobes.push({ x: w*(0.14+0.72*t) + (R()-.5)*w*0.05,
                 y: clamp(h*(0.66 - Math.sin(t*Math.PI)*0.26) + (R()-.5)*h*0.05,
                          r+2, h-r-2),
                 r });
  }
  x.save();
  for(const L of lobes){
    const g=x.createRadialGradient(L.x, L.y-L.r*0.35, L.r*0.1, L.x, L.y, L.r);
    g.addColorStop(0,   `hsla(${tint[0]},${tint[1]}%,99%,1)`);
    g.addColorStop(0.55,`hsla(${tint[0]},${tint[1]}%,92%,1)`);
    g.addColorStop(1,   `hsla(${tint[0]+14},${tint[1]}%,80%,1)`);
    x.fillStyle=g; x.beginPath(); x.arc(L.x,L.y,L.r,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-atop';
  const sg=x.createLinearGradient(0,h*0.25,0,h);
  sg.addColorStop(0,'rgba(255,255,255,0)');
  sg.addColorStop(1,`hsla(${tint[0]+30},70%,62%,.55)`);
  x.fillStyle=sg; x.fillRect(0,0,w,h);
  const rg=x.createLinearGradient(0,h*0.10,0,h*0.55);
  rg.addColorStop(0,'rgba(255,246,214,.8)');
  rg.addColorStop(1,'rgba(255,246,214,0)');
  x.fillStyle=rg; x.fillRect(0,0,w,h*0.55);
  x.restore();
  return c;
}

/* --- floating island: grassy cap, rocky spike, glowing crystals, hanging vines --- */
function makeIsland(w,h,seed,hue){
  const c=offscreen(w,h), x=c.getContext('2d'), R=makeRng(seed);
  const cx=w/2, capY=h*0.30, capW=w*0.46, capH=h*0.16;
  // rock body
  x.beginPath();
  x.moveTo(cx-capW, capY);
  const segs=7;
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const px = lerp(cx-capW, cx+capW*0.12, t) + (R()-.5)*w*0.05;
    const py = lerp(capY, h*0.94, Math.pow(t,1.6));
    x.lineTo(px,py);
  }
  x.lineTo(cx+capW*0.30, h*0.86);
  for(let i=segs;i>=0;i--){
    const t=i/segs;
    const px = lerp(cx+capW, cx+capW*0.30, t) + (R()-.5)*w*0.04;
    const py = lerp(capY, h*0.86, Math.pow(t,1.7));
    x.lineTo(px,py);
  }
  x.closePath();
  const rg=x.createLinearGradient(0,capY,0,h);
  rg.addColorStop(0, hsl(hue+250, 45, 34));
  rg.addColorStop(.45,hsl(hue+255, 42, 24));
  rg.addColorStop(1,  hsl(hue+262, 48, 14));
  x.fillStyle=rg; x.fill();
  // rock rim light
  x.save(); x.clip();
  const lg=x.createLinearGradient(cx-capW,capY,cx,h*0.8);
  lg.addColorStop(0,'rgba(190,160,255,.35)'); lg.addColorStop(.5,'rgba(190,160,255,0)');
  x.fillStyle=lg; x.fillRect(0,0,w,h);
  x.restore();
  // grass cap
  x.beginPath();
  x.ellipse(cx, capY, capW*1.03, capH, 0, 0, TAU);
  const gg=x.createLinearGradient(0,capY-capH,0,capY+capH);
  gg.addColorStop(0, hsl(hue, 78, 62));
  gg.addColorStop(.55,hsl(hue+6, 68, 46));
  gg.addColorStop(1, hsl(hue+12, 62, 30));
  x.fillStyle=gg; x.fill();
  // grass highlight
  x.beginPath(); x.ellipse(cx-capW*0.18, capY-capH*0.35, capW*0.62, capH*0.45, -0.12, 0, TAU);
  x.fillStyle=hsl(hue-6,85,72,.5); x.fill();
  // tufts
  for(let i=0;i<10;i++){
    const a=R()*TAU, rr=R();
    const gx=cx+Math.cos(a)*capW*rr, gy=capY+Math.sin(a)*capH*rr*0.8;
    x.beginPath(); x.moveTo(gx,gy);
    x.quadraticCurveTo(gx+(R()-.5)*10, gy-14-R()*10, gx+(R()-.5)*14, gy-20-R()*14);
    x.lineWidth=2.5+R()*2; x.lineCap='round'; x.strokeStyle=hsl(hue-4,80,64,.85); x.stroke();
  }
  // glowing crystals
  for(let i=0;i<3;i++){
    const gx=cx+(R()-.5)*capW*1.2, gy=capY+capH*0.5+R()*h*0.28, s=6+R()*10;
    const ch=(hue+180+R()*60)%360;
    x.save(); x.translate(gx,gy); x.rotate((R()-.5)*.5);
    x.beginPath(); x.moveTo(0,-s*1.7); x.lineTo(s*.6,0); x.lineTo(0,s*1.1); x.lineTo(-s*.6,0); x.closePath();
    const cg=x.createLinearGradient(0,-s*1.7,0,s*1.1);
    cg.addColorStop(0,hsl(ch,100,86,.95)); cg.addColorStop(1,hsl(ch,100,58,.9));
    x.fillStyle=cg; x.shadowColor=hsl(ch,100,70,.9); x.shadowBlur=16; x.fill();
    x.restore();
  }
  return c;
}

const SKY = {
  t:0, stars:[], hero:[], bokeh:[], clouds:[], islands:[], ready:false, field:null,
  init(){
    const R = makeRng(20260730);
    for(let i=0;i<300;i++){
      const layer = i<150?0 : i<240?1 : 2;
      this.stars.push({ x:R()*VW, y:R()*VH*0.96, r:(layer===0?0.9:layer===1?1.5:2.2)*(0.6+R()*0.9),
        p:R()*TAU, sp:0.7+R()*2.2, layer, h: R()<.28 ? 45 : R()<.55 ? 200 : 288 });
    }
    for(let i=0;i<20;i++) this.hero.push({ x:R()*VW, y:R()*VH*0.8, r:2.4+R()*2.2,
      p:R()*TAU, sp:.8+R()*1.8, h: R()<.5?45:196 });
    for(let i=0;i<22;i++){
      this.bokeh.push({ x:R()*VW, y:R()*VH, r:16+R()*44, h:R()<.5?45:290,
        vy:-(4+R()*12), vx:(R()-.5)*8, a:.06+R()*.09, p:R()*TAU });
    }
    // bake sky gradient + nebulae + starfield + haze into one static plate
    const f=offscreen(VW,VH), fx=f.getContext('2d');
    const g=fx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0,   hsl(248, 66, 13));
    g.addColorStop(.34, hsl(264, 60, 19));
    g.addColorStop(.62, hsl(290, 54, 25));
    g.addColorStop(.85, hsl(328, 58, 29));
    g.addColorStop(1,   hsl(22,  76, 35));
    fx.fillStyle=g; fx.fillRect(0,0,VW,VH);
    fx.globalCompositeOperation='lighter';
    for(let i=0;i<3;i++){
      const px=VW*(0.2+0.3*i), py=VH*(0.26+0.14*i), rr=300+i*110;
      const h=[286,205,336][i];
      const ng=fx.createRadialGradient(px,py,0,px,py,rr);
      ng.addColorStop(0,hsl(h,90,60,.22)); ng.addColorStop(.5,hsl(h,90,55,.09));
      ng.addColorStop(1,hsl(h,90,50,0));
      fx.fillStyle=ng; fx.fillRect(px-rr,py-rr,rr*2,rr*2);
    }
    for(const s of this.stars){
      const r=s.r*3.6;
      const sg=fx.createRadialGradient(s.x,s.y,0,s.x,s.y,r);
      sg.addColorStop(0,hsl(s.h,100,97,.92));
      sg.addColorStop(.26,hsl(s.h,100,82,.40));
      sg.addColorStop(1,hsl(s.h,100,72,0));
      fx.fillStyle=sg; fx.fillRect(s.x-r,s.y-r,r*2,r*2);
      if(s.layer===2){
        fx.strokeStyle=hsl(s.h,100,95,.28); fx.lineWidth=1.1;
        fx.beginPath();
        fx.moveTo(s.x-r,s.y); fx.lineTo(s.x+r,s.y);
        fx.moveTo(s.x,s.y-r); fx.lineTo(s.x,s.y+r); fx.stroke();
      }
    }
    fx.globalCompositeOperation='source-over';
    const hg=fx.createLinearGradient(0,VH*0.72,0,VH);
    hg.addColorStop(0,'rgba(255,170,120,0)');
    hg.addColorStop(1,'rgba(255,164,110,.16)');
    fx.fillStyle=hg; fx.fillRect(0,VH*0.72,VW,VH*0.28);
    this.field=f;

    // playfield scrim baked separately so the toys always read against the backdrop
    const sc=offscreen(VW,VH), sx=sc.getContext('2d');
    const pg=sx.createLinearGradient(0,CEIL,0,PLAY_BOT+160);
    pg.addColorStop(0,'rgba(12,3,36,.50)');
    pg.addColorStop(.72,'rgba(12,3,36,.26)');
    pg.addColorStop(1,'rgba(12,3,36,0)');
    sx.fillStyle=pg; sx.fillRect(WALL,CEIL,VW-WALL*2,PLAY_BOT+160-CEIL);
    this.scrim=sc;

    this.cloudSprites = [ makeCloud(420,190,11,[204,72]), makeCloud(330,150,29,[262,60]), makeCloud(520,220,47,[190,78]) ];
    for(let i=0;i<5;i++){
      this.clouds.push({ s:this.cloudSprites[i%3], x:R()*VW, y:70+R()*VH*0.42,
        sc:.45+R()*.7, vx:(R()<.5?-1:1)*(5+R()*10), a:.13+R()*.12, bob:R()*TAU });
    }
    this.islandSprites = [ makeIsland(320,250,7,118), makeIsland(250,205,13,152), makeIsland(390,290,23,96) ];
    this.islands = [
      { s:this.islandSprites[0], x:VW*0.10, y:VH*0.86, sc:.85, bob:0.0, a:.80 },
      { s:this.islandSprites[1], x:VW*0.91, y:VH*0.78, sc:.72, bob:1.9, a:.70 },
      { s:this.islandSprites[2], x:VW*0.53, y:VH*0.99, sc:1.0, bob:3.4, a:.62 }
    ];
    this.ready=true;
  },
  update(dt){
    this.t+=dt;
    for(const c of this.clouds){
      c.x+=c.vx*dt;
      if(c.x < -600) c.x = VW+400; if(c.x > VW+600) c.x = -400;
    }
    for(const b of this.bokeh){
      b.y+=b.vy*dt; b.x+=b.vx*dt;
      if(b.y < -80){ b.y=VH+60; b.x=Math.random()*VW; }
      if(b.x<-90) b.x=VW+80; if(b.x>VW+90) b.x=-80;
    }
  },
  draw(c, feverAmt=0){
    const t=this.t;
    // 1 — baked plate: sky gradient + nebulae + starfield + ground haze
    c.drawImage(this.field, 0, 0);

    c.globalCompositeOperation='lighter';
    // 2 — aurora ribbons
    for(let b=0;b<3;b++){
      const baseY = VH*(0.14+b*0.10);
      const amp = 46+b*20, hh = 120+b*44;
      const hue = [172, 292, 46][b];
      c.beginPath();
      c.moveTo(-40, baseY);
      for(let x=-40;x<=VW+40;x+=64){
        const y = baseY + Math.sin(x*0.0042 + t*(0.36+b*0.12) + b*2.0)*amp
                        + Math.sin(x*0.0113 - t*0.22 + b)*amp*0.35;
        c.lineTo(x,y);
      }
      for(let x=VW+40;x>=-40;x-=64){
        const y = baseY + hh + Math.sin(x*0.0038 - t*(0.28+b*0.1) + b*1.3)*amp*0.8;
        c.lineTo(x,y);
      }
      c.closePath();
      const ag=c.createLinearGradient(0,baseY-amp,0,baseY+hh+amp);
      ag.addColorStop(0,  hsl(hue,95,66,0));
      ag.addColorStop(.42,hsl(hue,95,62,.12+feverAmt*.06));
      ag.addColorStop(1,  hsl(hue+22,95,60,0));
      c.fillStyle=ag; c.fill();
    }
    // 3 — live twinklers over the baked field
    for(const s of this.hero){
      const tw=0.35+0.65*Math.abs(Math.sin(t*s.sp+s.p));
      drawDot(c,s.x,s.y,s.r*5.5*(0.7+tw*0.6),s.h,tw*0.8);
    }
    // 4 — bokeh
    for(const b of this.bokeh){
      const a=b.a*(0.6+0.4*Math.sin(t*1.1+b.p));
      drawDot(c,b.x,b.y,b.r,b.h,a);
    }
    c.globalCompositeOperation='source-over';

    // 5 — clouds
    for(const cl of this.clouds){
      c.globalAlpha=cl.a;
      const w=cl.s.width*cl.sc, h=cl.s.height*cl.sc;
      c.drawImage(cl.s, cl.x-w/2, cl.y-h/2 + Math.sin(t*0.5+cl.bob)*7, w,h);
    }
    c.globalAlpha=1;

    // 6 — floating islands
    for(const is of this.islands){
      c.globalAlpha=is.a;
      const w=is.s.width*is.sc, h=is.s.height*is.sc;
      c.drawImage(is.s, is.x-w/2, is.y-h*0.42 + Math.sin(t*0.55+is.bob)*9, w,h);
    }
    c.globalAlpha=1;

    // 7 — playfield scrim: pushes the backdrop back so the toys read clearly
    c.drawImage(this.scrim, 0, 0);

    if(feverAmt>0){
      c.globalCompositeOperation='lighter';
      c.fillStyle=`rgba(255,110,220,${0.05*feverAmt})`;
      c.fillRect(0,0,VW,VH);
      c.globalCompositeOperation='source-over';
    }
  }
};

/* ================================================================== 5. ENTITIES ======== */

/* -- Star: a golden rescue star with a friend inside. Pops on contact, then respawns. -- */
class Bubble {
  constructor(x,y,r,star,hue,rng){
    this.x=x; this.y=y; this.hx=x; this.hy=y; this.r=r;
    this.star=star; this.hue=hue;
    this.alive=true; this.pop=0; this.respawn=0;
    this.ph=rng()*TAU; this.spin=rnd(0.6,-0.6);
    this.wobA=star?5:3; this.wobS=0.7+rng()*0.8;
    this.mover=null;             // {ax,ay,sp,ph} orbit for moving targets
    this.sc=0; this.born=0;      // spawn animation
    this.flash=0;
    this.face=(rng()*4)|0;
  }
  get cx(){ return this.x; } get cy(){ return this.y; }
  update(dt,t){
    this.born=Math.min(1,this.born+dt*2.4);
    this.sc=E.outBack(this.born);
    this.ph+=dt*this.wobS;
    this.flash=Math.max(0,this.flash-dt*4);
    if(this.mover){
      const m=this.mover;
      this.x = this.hx + Math.cos(t*m.sp+m.ph)*m.ax;
      this.y = this.hy + Math.sin(t*m.sp*1.3+m.ph)*m.ay;
    }
    if(this.pop>0) this.pop=Math.min(1,this.pop+dt*3.2);
  }
  draw(c, glow, t){
    if(!this.alive && this.pop>=1) return;
    const wob = Math.sin(this.ph)*this.wobA*(this.alive?1:0);
    let r = this.r * this.sc;
    let a = 1;
    if(!this.alive){ const k=E.outCubic(this.pop); r*=1+k*1.5; a=1-k; }
    if(r<=0.5) return;
    const x=this.x, y=this.y + wob*0.35;

    if(glow){
      const hue = this.star ? (t*90+this.ph*40)%360 : this.hue;
      c.globalCompositeOperation='lighter';
      drawDot(c,x,y,r*2.1,this.star?46:hue,(this.star?.30:.26)*a);
      c.globalCompositeOperation='source-over';
      return;
    }

    c.save(); c.globalAlpha=a;
    if(this.star){
      const hue=(t*90 + this.ph*40)%360;
      const pulse = 1 + Math.sin(t*3.4+this.ph)*0.06;
      const spr=SPR.star(hue);
      const half=(spr.width/2)*(r*pulse/SPR.SR);
      c.translate(x,y); c.rotate(t*0.5+this.ph);
      c.drawImage(spr,-half,-half,half*2,half*2);
    } else {
      const spr=SPR.bubble(this.hue,this.face);
      const half=(spr.width/2)*(r/SPR.BR);
      c.translate(x,y);
      c.scale(1+wob*0.006, 1-wob*0.006);
      c.drawImage(spr,-half,-half,half*2,half*2);
    }
    if(this.flash>0){
      c.globalCompositeOperation='lighter';
      c.globalAlpha=this.flash*0.6*a;
      c.drawImage(SPR.dot(45), -r*1.6,-r*1.6, r*3.2, r*3.2);
    }
    c.restore();
  }
}

/* -- a tiny cute creature (used inside bubbles and as freed friends) -- */
function drawFuzzle(c,x,y,r,hue,variant,t,alpha=1){
  c.save(); c.globalAlpha*=alpha;
  const bob=Math.sin(t*2.2)*r*0.10;
  y+=bob;
  // body
  const g=c.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r*1.05);
  g.addColorStop(0,hsl(hue,90,84)); g.addColorStop(.6,hsl(hue,82,66)); g.addColorStop(1,hsl(hue+18,78,50));
  c.fillStyle=g;
  c.beginPath(); c.ellipse(x,y,r,r*0.92,0,0,TAU); c.fill();
  // ears / spikes by variant
  c.fillStyle=hsl(hue,84,70);
  if(variant===0){
    for(const s of [-1,1]){ c.beginPath(); c.ellipse(x+s*r*0.62,y-r*0.72,r*0.22,r*0.38,s*0.4,0,TAU); c.fill(); }
  } else if(variant===1){
    c.beginPath(); c.moveTo(x-r*.4,y-r*.7); c.lineTo(x,y-r*1.5); c.lineTo(x+r*.4,y-r*.7); c.closePath(); c.fill();
  } else if(variant===2){
    for(const s of [-1,0,1]){ c.beginPath(); c.arc(x+s*r*0.5, y-r*0.85, r*0.20,0,TAU); c.fill(); }
  } else {
    c.beginPath(); c.ellipse(x, y-r*1.05, r*0.28, r*0.22, 0,0,TAU); c.fill();
  }
  drawFace(c,x,y+r*0.05,r*0.78,t,'happy');
  c.restore();
}

/* -- expressive face: eyes with highlight + blink, cheeks, mouth by mood -- */
function drawFace(c,x,y,r,t,mood='happy',look=0){
  const blink = (Math.sin(t*0.9)>0.985 || Math.sin(t*0.53+2)>0.99) ? 0.12 : 1;
  const ex=r*0.36, ey=-r*0.10, er=r*0.24;
  const lx = clamp(look,-1,1)*er*0.30;
  for(const s of [-1,1]){
    c.fillStyle='rgba(28,14,52,.92)';
    c.beginPath(); c.ellipse(x+s*ex, y+ey, er*0.72, er*blink, 0,0,TAU); c.fill();
    if(blink>0.5){
      c.fillStyle='rgba(255,255,255,.95)';
      c.beginPath(); c.arc(x+s*ex - er*0.22 + lx, y+ey-er*0.28, er*0.26, 0, TAU); c.fill();
      c.fillStyle='rgba(255,255,255,.55)';
      c.beginPath(); c.arc(x+s*ex + er*0.22 + lx, y+ey+er*0.18, er*0.13, 0, TAU); c.fill();
    }
  }
  // cheeks
  c.fillStyle='rgba(255,110,150,.38)';
  for(const s of [-1,1]){ c.beginPath(); c.ellipse(x+s*r*0.62, y+r*0.28, r*0.20, r*0.13,0,0,TAU); c.fill(); }
  // mouth
  c.strokeStyle='rgba(28,14,52,.9)'; c.lineWidth=Math.max(1.4,r*0.11); c.lineCap='round';
  c.beginPath();
  if(mood==='happy'){ c.arc(x, y+r*0.16, r*0.30, 0.22*Math.PI, 0.78*Math.PI); }
  else if(mood==='wow'){ c.ellipse(x,y+r*0.30,r*0.17,r*0.21,0,0,TAU); c.fillStyle='rgba(28,14,52,.85)'; c.fill(); }
  else { c.moveTo(x-r*0.22,y+r*0.30); c.lineTo(x+r*0.22,y+r*0.30); }
  c.stroke();
}
</script>
<script>
"use strict";
/* ================================================================== 6. PLAY ENTITIES === */

const LAUNCH_X = VW/2, LAUNCH_Y = 672;
const GRAV = 900;
const PMIN = 760, PMAX = 1180;
const AIM_MAX = 1.10;
const MUZZLE = 72;                      // distance from cannon pivot to muzzle mouth
const ZIP_R = 15;

/* --- Zip: the star-comet the child launches --- */
class Zip {
  constructor(){
    this.x=LAUNCH_X; this.y=LAUNCH_Y; this.vx=0; this.vy=0;
    this.flying=false; this.trail=[]; this.t=0; this.squash=0; this.spin=0;
    this.hitCount=0; this.starCount=0; this.combo=0; this.age=0; this.dead=false;
  }
  launch(ang,power){
    this.x=LAUNCH_X + Math.sin(ang)*MUZZLE; this.y=LAUNCH_Y - Math.cos(ang)*MUZZLE;
    this.vx=Math.sin(ang)*power; this.vy=-Math.cos(ang)*power;
    this.flying=true; this.trail.length=0; this.age=0;
    this.hitCount=0; this.starCount=0; this.combo=0; this.dead=false;
  }
  draw(c, glow, t){
    if(!this.flying && !glow) return;
    const sp=Math.hypot(this.vx,this.vy);
    const ang=Math.atan2(this.vy,this.vx);
    const st=clamp(sp/1400,0,1);
    const sx=1+st*0.55+this.squash*0.5, sy=1-st*0.26-this.squash*0.35;
    const r=ZIP_R;

    // --- trail ribbon ---
    if(this.trail.length>2){
      c.globalCompositeOperation='lighter';
      for(let i=1;i<this.trail.length;i++){
        const p0=this.trail[i-1], p1=this.trail[i];
        const k=i/this.trail.length;
        const w=r*1.75*k*k;
        const hue=(t*160 + i*7)%360;
        c.strokeStyle=hsl(hue,100,glow?70:66, (glow?.55:.42)*k);
        c.lineWidth=w*(glow?1.8:1); c.lineCap='round';
        c.beginPath(); c.moveTo(p0.x,p0.y); c.lineTo(p1.x,p1.y); c.stroke();
      }
      c.globalCompositeOperation='source-over';
    }
    if(glow){
      c.globalCompositeOperation='lighter';
      drawDot(c,this.x,this.y,r*4.2,45,0.9);
      c.globalCompositeOperation='source-over';
      return;
    }
    // --- body ---
    c.save(); c.translate(this.x,this.y); c.rotate(ang); c.scale(sx,sy); c.rotate(-ang);
    const bg=c.createRadialGradient(-r*.35,-r*.42,r*.08, 0,0,r*1.12);
    bg.addColorStop(0,  '#fffdf2');
    bg.addColorStop(.28,'#ffe9a3');
    bg.addColorStop(.62,'#ffc44d');
    bg.addColorStop(.90,'#ff8f3c');
    bg.addColorStop(1,  '#f2652b');
    c.fillStyle=bg; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
    // little star crown
    c.save(); c.rotate(t*2.2); c.globalAlpha=.55;
    starPath(c,0,0,r*0.92,r*0.40,5,-Math.PI/2);
    c.fillStyle='rgba(255,255,255,.5)'; c.fill(); c.restore();
    // rim
    c.lineWidth=r*.14; c.strokeStyle='rgba(255,255,255,.6)';
    c.beginPath(); c.arc(0,0,r*.92,Math.PI*.1,Math.PI*.9); c.stroke();
    c.restore();
    drawFace(c,this.x,this.y,r*0.92, t*2.4, sp>900?'wow':'happy', Math.cos(ang));
    // specular
    c.fillStyle='rgba(255,255,255,.9)';
    c.beginPath(); c.ellipse(this.x-r*.36,this.y-r*.40,r*.24,r*.17,-0.5,0,TAU); c.fill();
  }
}

/* --- Bumper: springy jelly blob that reflects Zip (the "predictable reflector") --- */
class Bumper {
  constructor(x,y,r,hue){ this.x=x; this.y=y; this.r=r; this.hue=hue; this.hit=0; this.ph=rnd(TAU); this.born=0; }
  update(dt){ this.hit=Math.max(0,this.hit-dt*3.4); this.born=Math.min(1,this.born+dt*2.2); this.ph+=dt; }
  draw(c,glow,t){
    const s=E.outBack(this.born); if(s<=0) return;
    const pop=1+this.hit*0.36;
    const r=this.r*s*pop;
    const x=this.x, y=this.y+Math.sin(t*1.4+this.ph)*3;
    if(glow){
      c.globalCompositeOperation='lighter';
      drawDot(c,x,y,r*2.1,this.hue,0.30+this.hit*0.5);
      c.globalCompositeOperation='source-over'; return;
    }
    const wob=Math.sin(t*3+this.ph)*0.05 + this.hit*0.14;
    const spr=SPR.bumper(this.hue);
    const half=(spr.width/2)*(r/42);
    c.save(); c.translate(x,y); c.rotate(this.ph*0.35+t*0.5); c.scale(1+wob,1-wob);
    c.drawImage(spr,-half,-half,half*2,half*2);
    c.restore();
    drawFace(c,x,y,r*0.58,t*1.8+this.ph, this.hit>0.2?'wow':'happy');
  }
}

/* --- Rail: glowing candy bar; teaches angle-in = angle-out --- */
class Rail {
  constructor(x1,y1,x2,y2,r,hue){
    this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;this.r=r;this.hue=hue;
    this.hit=0; this.born=0; this.ph=rnd(TAU);
  }
  update(dt){ this.hit=Math.max(0,this.hit-dt*3); this.born=Math.min(1,this.born+dt*2); }
  closest(px,py){
    const dx=this.x2-this.x1, dy=this.y2-this.y1;
    const L2=dx*dx+dy*dy || 1;
    let t=((px-this.x1)*dx+(py-this.y1)*dy)/L2;
    t=clamp(t,0,1);
    return {x:this.x1+dx*t, y:this.y1+dy*t, t};
  }
  draw(c,glow,t){
    const s=E.outCubic(this.born); if(s<=0.02) return;
    const mx=(this.x1+this.x2)/2, my=(this.y1+this.y2)/2;
    const x1=lerp(mx,this.x1,s), y1=lerp(my,this.y1,s);
    const x2=lerp(mx,this.x2,s), y2=lerp(my,this.y2,s);
    const r=this.r*(1+this.hit*0.30);
    if(glow){
      c.globalCompositeOperation='lighter';
      c.lineCap='round'; c.lineWidth=r*3.0;
      c.strokeStyle=hsl(this.hue,100,62,.16+this.hit*.4);
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke();
      c.globalCompositeOperation='source-over'; return;
    }
    const ang=Math.atan2(y2-y1,x2-x1), len=Math.hypot(x2-x1,y2-y1);
    c.save(); c.translate((x1+x2)/2,(y1+y2)/2); c.rotate(ang);
    // shadow
    c.fillStyle='rgba(18,8,40,.35)';
    rrect(c,-len/2-r,-r+4,len+r*2,r*2,r); c.fill();
    // body
    const g=c.createLinearGradient(0,-r,0,r);
    g.addColorStop(0,hsl(this.hue,100,90));
    g.addColorStop(.42,hsl(this.hue,95,68));
    g.addColorStop(1,hsl(this.hue+16,88,44));
    c.fillStyle=g; rrect(c,-len/2-r,-r,len+r*2,r*2,r); c.fill();
    // candy stripes
    c.save(); rrect(c,-len/2-r,-r,len+r*2,r*2,r); c.clip();
    c.globalAlpha=.28; c.fillStyle='#fff';
    const n=Math.ceil((len+r*2)/(r*1.5))+2, off=(t*26)%(r*1.5);
    for(let i=0;i<n;i++) c.fillRect(-len/2-r+i*r*1.5-r*0.3+off,-r*1.6,r*0.5,r*3.2);
    c.restore();
    // top gloss
    c.fillStyle='rgba(255,255,255,.55)';
    rrect(c,-len/2-r*0.6,-r*0.72,len+r*1.2,r*0.5,r*0.25); c.fill();
    c.restore();
  }
}

/* --- Freed Fuzzle: flies from a popped star up to the rescue perch --- */
class Freed {
  constructor(x,y,hue,variant,slot){
    this.x=x; this.y=y; this.sx=x; this.sy=y; this.hue=hue; this.v=variant;
    this.tx=WALL+40+slot*31; this.ty=54;             // flies home into the HUD star row
    this.t=0; this.dur=rnd(1.4,1.0); this.arrived=false; this.gone=0;
    this.cx=lerp(x,this.tx,.5)+rnd(160,-160); this.cy=Math.min(y,this.ty)-rnd(180,90);
    this.ph=rnd(TAU);
  }
  update(dt){
    if(this.arrived){ this.gone+=dt; return; }
    this.t+=dt;
    const k=clamp(this.t/this.dur,0,1), e=E.inOutCubic(k);
    const u=1-e;
    this.x = u*u*this.sx + 2*u*e*this.cx + e*e*this.tx;
    this.y = u*u*this.sy + 2*u*e*this.cy + e*e*this.ty;
    if(Math.random()<0.55) emit({kind:'spark',x:this.x,y:this.y,vx:rnd(60,-60),vy:rnd(60,-60),
      g:0,drag:.92,life:.45,r:rnd(6,3),h:this.hue,s:100,l:78});
    if(k>=1){ this.arrived=true; SND.fuzzle();
      burst(this.x,this.y,12,this.hue,{spd:190,g:60}); }
  }
  get dead(){ return this.arrived && this.gone>0.45; }
  draw(c,glow,t){
    if(this.dead) return;
    const fade = this.arrived ? clamp(1-this.gone/0.45,0,1) : 1;
    if(glow){
      c.globalCompositeOperation='lighter';
      drawDot(c,this.x,this.y,34,this.hue,0.4*fade);
      c.globalCompositeOperation='source-over'; return;
    }
    const pop = this.arrived ? 1+(1-fade)*0.8 : 1;
    c.save(); c.globalAlpha=fade;
    drawFuzzle(c,this.x,this.y,15*pop,this.hue,this.v,t*1.6+this.ph,1);
    c.restore();
  }
}

/* ================================================================== 7. LEVEL GEN ======= */
/* Procedural, seeded, and shaped by both level number and the child's measured skill.    */

const PLAY_TOP = 120, PLAY_BOT = 450;

function overlaps(list, x, y, r, pad=6){
  for(const o of list){
    const rr = (o.r||30) + r + pad;
    if(dist2(x,y,o.x,o.y) < rr*rr) return true;
  }
  return false;
}
function safeFromLaunch(x,y,r){
  return dist2(x,y,LAUNCH_X,LAUNCH_Y) > (r+190)*(r+190);
}

function patternPoints(kind, R, n){
  const pts=[];
  const L=WALL+72, Rt=VW-WALL-72, T=PLAY_TOP+24, B=PLAY_BOT-24;
  const cx=VW/2, cy=(T+B)/2;
  switch(kind){
    case 'grid': {
      const cols=6+((R()*3)|0), rows=Math.max(2,Math.round(n/cols));
      for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){
        const off=(r%2)*((Rt-L)/cols/2);
        pts.push({x:L+off+i*((Rt-L)/(cols-1))*0.94, y:T+r*((B-T)/Math.max(1,rows-1))*0.8});
      }
      break;
    }
    case 'arcs': {
      const bands=3;
      for(let b=0;b<bands;b++){
        const rr=140+b*95, cnt=Math.ceil(n/bands);
        for(let i=0;i<cnt;i++){
          const a=Math.PI*(0.12+0.76*(i/(cnt-1||1)));
          pts.push({x:cx-Math.cos(a)*rr*1.55, y:cy-90+Math.sin(a)*rr*0.62});
        }
      }
      break;
    }
    case 'flower': {
      const petals=5+((R()*3)|0);
      for(let i=0;i<n;i++){
        const a=(i/n)*TAU*2.0;
        const rr=(90+Math.sin(a*petals/2)*95) * (1+ (i/n)*0.55);
        pts.push({x:cx+Math.cos(a)*rr*1.5, y:cy+Math.sin(a)*rr*0.72});
      }
      break;
    }
    case 'spiral': {
      for(let i=0;i<n;i++){
        const t=i/n, a=t*TAU*2.3+R()*0.4, rr=52+t*250;
        pts.push({x:cx+Math.cos(a)*rr*1.45, y:cy+Math.sin(a)*rr*0.68});
      }
      break;
    }
    case 'wave': {
      const rows=3;
      for(let r=0;r<rows;r++){
        const cnt=Math.ceil(n/rows);
        for(let i=0;i<cnt;i++){
          const t=i/(cnt-1||1);
          pts.push({x:L+t*(Rt-L), y:T+40+r*((B-T)/3.1)+Math.sin(t*TAU*1.35+r*1.1)*62});
        }
      }
      break;
    }
    case 'pillars': {
      const cols=5+((R()*3)|0);
      for(let i=0;i<cols;i++){
        const x=L+i*((Rt-L)/(cols-1));
        const h=3+((R()*3)|0);
        for(let j=0;j<h;j++) pts.push({x, y:T+30+j*74 + (i%2)*30});
      }
      break;
    }
    case 'diamond': {
      const layers=4;
      for(let l=0;l<layers;l++){
        const cnt=(l+1)*3;
        for(let i=0;i<cnt;i++){
          const a=(i/cnt)*TAU;
          pts.push({x:cx+Math.cos(a)*(l+1)*72*1.4, y:cy+Math.sin(a)*(l+1)*52});
        }
      }
      break;
    }
  }
  return pts;
}

function genArena(seed){
  const R = makeRng(seed >>> 0);
  const bumpers=[], rails=[];
  const nRails = 2, nBumpers = 3;

  // ---- rails: the banking geometry ----
  for(let i=0;i<nRails;i++){
    let tries=0;
    while(tries++<80){
      const side = i%2 ? 1 : -1;
      const cx = VW/2 + side*lerp(200,330,R());
      const cy = lerp(PLAY_TOP+120, PLAY_BOT-40, R());
      const len= lerp(140,210,R());
      const ang= (-side)*lerp(0.35,1.05,R()) + (R()<0.5?0:Math.PI);
      const x1=cx-Math.cos(ang)*len/2, y1=cy-Math.sin(ang)*len/2;
      const x2=cx+Math.cos(ang)*len/2, y2=cy+Math.sin(ang)*len/2;
      if(Math.min(x1,x2)<WALL+50 || Math.max(x1,x2)>VW-WALL-50) continue;
      if(Math.min(y1,y2)<PLAY_TOP+40 || Math.max(y1,y2)>PLAY_BOT-10) continue;
      if(!safeFromLaunch(cx,cy,len/2)) continue;
      if(overlaps(rails.map(r=>({x:(r.x1+r.x2)/2,y:(r.y1+r.y2)/2,r:120})),cx,cy,60)) continue;
      rails.push(new Rail(x1,y1,x2,y2,11,[192,286,44][i%3]));
      break;
    }
  }
  // ---- jelly bumpers ----
  const solid = rails.map(r=>({x:(r.x1+r.x2)/2, y:(r.y1+r.y2)/2, r:Math.hypot(r.x2-r.x1,r.y2-r.y1)/2+16}));
  for(let i=0;i<nBumpers;i++){
    let tries=0;
    while(tries++<140){
      const x=lerp(WALL+90, VW-WALL-90, R());
      const y=lerp(PLAY_TOP+80, PLAY_BOT-20, R());
      const r=lerp(32,42,R());
      if(!safeFromLaunch(x,y,r)) continue;
      if(overlaps(solid,x,y,r,30)) continue;
      bumpers.push(new Bumper(x,y,r,[330,150,32,268][i%4]));
      solid.push({x,y,r:r+10});
      break;
    }
  }

  const world = { bumpers, rails, stars:[] };

  // ---- candidate star slots on a jittered grid, clear of the furniture ----
  const slots=[];
  const cols=9, rows=5;
  for(let gy=0;gy<rows;gy++) for(let gx=0;gx<cols;gx++){
    const x = lerp(WALL+62, VW-WALL-62, gx/(cols-1)) + (R()-.5)*22;
    const y = lerp(PLAY_TOP+10, PLAY_BOT-16, gy/(rows-1)) + (R()-.5)*18;
    if(!safeFromLaunch(x,y,STAR_R)) continue;
    if(overlaps(solid,x,y,STAR_R,14)) continue;
    const edge = Math.min(x-WALL, VW-WALL-x)/(VW/2);        // 1 centre, 0 at a wall
    const high = 1 - inv(PLAY_TOP, PLAY_BOT, y);            // 1 at the ceiling
    slots.push({ x, y, hard: clamp((1-edge)*0.75 + high*0.55, 0, 1), ok:false });
  }

  // ---- keep only slots a real shot can actually reach ----
  markReachable(world, slots);
  const good = slots.filter(s=>s.ok);
  world.slots = good.length >= STAR_COUNT + 3 ? good : slots;   // safety net, never starve
  return world;
}

/* Sweep a fan of real trajectories once per round and flag every slot one passes through.
   This is what guarantees a child can always reach every star that will ever spawn. */
function markReachable(world, slots){
  for(let ai=0; ai<=26; ai++){
    const ang = -AIM_MAX + (ai/26)*(AIM_MAX*2);
    for(let pi=0; pi<=8; pi++){
      const pow = lerp(PMIN, PMAX, pi/8);
      const ox=LAUNCH_X+Math.sin(ang)*MUZZLE, oy=LAUNCH_Y-Math.cos(ang)*MUZZLE;
      const pts = simulate(ox,oy, Math.sin(ang)*pow, -Math.cos(ang)*pow, 5.0, world, true, 1/120);
      for(const p of pts){
        for(const s of slots){
          if(s.ok) continue;
          const rr = STAR_R + ZIP_R*0.86;
          if(dist2(p.x,p.y,s.x,s.y) < rr*rr) s.ok = true;
        }
      }
    }
  }
}

/* Pick a home for a new star: spread out from the live ones, and drifting toward the
   trickier slots as the child racks up rescues. */
function pickSlot(world, liveStars, progress){
  const target = clamp(progress, 0, 1) * 0.85;
  let best=null, bestK=Infinity;
  for(let i=0;i<26;i++){
    const s = world.slots[(Math.random()*world.slots.length)|0];
    if(!s) break;
    let near=0;
    for(const st of liveStars){
      if(!st.alive) continue;
      const d2=dist2(s.x,s.y,st.x,st.y);
      if(d2 < 150*150) near += 3;
      else if(d2 < 240*240) near += 1;
    }
    const k = near*1.4 + Math.abs(s.hard-target)*1.2 + Math.random()*0.35;
    if(k < bestK){ bestK=k; best=s; }
  }
  return best || world.slots[0];
}

/* ================================================================== 8. TRAJECTORY ====== */
/* Same integrator as the real ball, so the guide never lies.                              */
function simulate(x,y,vx,vy,duration,world,collide,step){
  const pts=[{x,y}]; const dt=step||1/180;
  let t=0;
  while(t<duration){
    vy += GRAV*dt;
    x += vx*dt; y += vy*dt;
    if(x < WALL+ZIP_R){ x=WALL+ZIP_R; vx=-vx*0.985; }
    else if(x > VW-WALL-ZIP_R){ x=VW-WALL-ZIP_R; vx=-vx*0.985; }
    if(y < CEIL+ZIP_R){ y=CEIL+ZIP_R; vy=Math.abs(vy)*0.985; }
    if(collide && world){
      for(const b of world.bumpers){
        const rr=b.r+ZIP_R;
        if(dist2(x,y,b.x,b.y) < rr*rr){
          let nx=x-b.x, ny=y-b.y; const d=Math.hypot(nx,ny)||1; nx/=d; ny/=d;
          x=b.x+nx*rr; y=b.y+ny*rr;
          const dot=vx*nx+vy*ny; vx-=2*dot*nx; vy-=2*dot*ny;
          vx*=1.02; vy*=1.02;
        }
      }
      for(const r of world.rails){
        const cp=r.closest(x,y); const rr=r.r+ZIP_R;
        if(dist2(x,y,cp.x,cp.y) < rr*rr){
          let nx=x-cp.x, ny=y-cp.y; const d=Math.hypot(nx,ny)||1; nx/=d; ny/=d;
          x=cp.x+nx*rr; y=cp.y+ny*rr;
          const dot=vx*nx+vy*ny; vx-=2*dot*nx; vy-=2*dot*ny;
        }
      }
    }
    pts.push({x,y});
    if(y > FLOOR) break;
    t+=dt;
  }
  return pts;
}
</script>
<script>
"use strict";
/* ================================================================== 9. GAME STATE ====== */
/* ONE round. 90 seconds. No levels, no lives, no menus in the way — just aim and fire.    */

const ROUND      = 90;      // seconds in a round
const STAR_COUNT = 6;       // rescue stars alive at once
const STAR_R     = 31;
const RELOAD     = 0.22;    // pause between a shot ending and the next aim

const SAVE_KEY = 'starbounce.v2';
const save = Object.assign(
  { best:0, bestRescued:0, skill:0.12, music:true, sfx:true, plays:0, rescued:0 },
  (()=>{ try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e){ return {}; } })()
);
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const G = {
  state:'title',           // title | aim | fly | over
  t:0, stateT:0, roundT:0, timeLeft:ROUND, reload:0,
  score:0, rescued:0, shots:0, timeUp:false,
  world:null, zip:new Zip(), freed:[],
  aimAng:-0.10, aimPow:0.66, aimVel:0, powVel:0,
  combo:0, bestCombo:0, fever:0, feverT:0,
  shakeX:0, shakeY:0, shakeAmt:0, hitstop:0, flash:0,
  skill: save.skill, assist:0, guideT:2.3,
  paused:false, menuSel:0, tutorial:0,
  lastSkillPips:0, resultStars:0, newBest:false
};

/* ------------------------------------------------- input ------------------------------- */
const keys = { l:false, r:false, u:false, d:false };
const KEYMAP = { ArrowLeft:'l', ArrowRight:'r', ArrowUp:'u', ArrowDown:'d' };
let started=false;

addEventListener('keydown', e=>{
  const k=e.key;
  if(k===' '||k==='Spacebar'||k==='ArrowLeft'||k==='ArrowRight'||k==='ArrowUp'||k==='ArrowDown') e.preventDefault();
  if(!started && (k===' '||k==='q'||k==='Q'||KEYMAP[k])){ started=true; SND.init(); SND.setMusic(save.music); SND.setSfx(save.sfx); }
  SND.resume();
  if(KEYMAP[k]) keys[KEYMAP[k]]=true;
  if(e.repeat) return;
  if(k==='q'||k==='Q'){ toggleMenu(); return; }
  if(G.paused){ menuKey(k); return; }
  if(k===' '||k==='Spacebar') pressSpace();
}, {passive:false});

addEventListener('keyup', e=>{ if(KEYMAP[e.key]) keys[KEYMAP[e.key]]=false; });
addEventListener('blur', ()=>{ keys.l=keys.r=keys.u=keys.d=false; });
/* Leaving the tab mid-round shouldn't cost time — freeze until they come back. */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && !G.paused && (G.state==='aim'||G.state==='fly')){
    G.paused=true; G.menuSel=0;
    keys.l=keys.r=keys.u=keys.d=false;
  }
});

function toggleMenu(){
  G.paused=!G.paused; G.menuSel=0;
  SND.ui(G.paused);
  if(!SND.ac) return;
  SND.music.gain.setTargetAtTime(save.music ? (G.paused?0.12:0.30) : 0, SND.ac.currentTime, .2);
}
function menuKey(k){
  if(k==='ArrowUp'){ G.menuSel=(G.menuSel+2)%3; SND.ui(true); }
  else if(k==='ArrowDown'){ G.menuSel=(G.menuSel+1)%3; SND.ui(false); }
  else if(k===' '||k==='Spacebar'){
    if(G.menuSel===0){ save.music=!save.music; SND.setMusic(save.music);
      if(SND.music&&save.music) SND.music.gain.setTargetAtTime(0.12,SND.ac.currentTime,.2); }
    else if(G.menuSel===1){ save.sfx=!save.sfx; SND.setSfx(save.sfx); }
    else { save.skill=0.12; G.skill=0.12; save.best=0; save.bestRescued=0; save.rescued=0; }
    persist(); SND.ui(true);
  }
}
function pressSpace(){
  switch(G.state){
    case 'title': startRound(); break;
    case 'aim':   doLaunch();   break;
    case 'over':  if(G.stateT>0.5) startRound(); break;
  }
}

/* ------------------------------------------------- flow -------------------------------- */
function spawnStar(){
  const s = pickSlot(G.world, G.world.stars, G.rescued/14);
  if(!s) return;
  const b = new Bubble(s.x, s.y, STAR_R, true, 48, Math.random);
  G.world.stars.push(b);
  emit({kind:'ring',x:s.x,y:s.y,r:8,r2:STAR_R*2.4,size:5,h:48,s:100,l:80,life:.45,g:0});
  for(let i=0;i<6;i++) emit({kind:'spark',x:s.x,y:s.y,vx:rnd(150,-150),vy:rnd(150,-150),
    g:0,drag:.9,life:.4,r:rnd(7,3),h:48,s:100,l:80});
}
function startRound(){
  G.world = genArena((Math.random()*0xffffffff)>>>0);
  G.world.stars = [];
  for(let i=0;i<STAR_COUNT;i++) spawnStar();
  G.timeLeft = ROUND; G.roundT = 0; G.timeUp = false;
  G.score = 0; G.rescued = 0; G.shots = 0;
  G.combo = 0; G.bestCombo = 0; G.fever = 0; G.feverT = 0;
  G.freed.length = 0; G.reload = 0;
  G.aimAng = -0.10; G.aimPow = 0.66; G.aimVel = 0; G.powVel = 0;
  G.zip.flying = false; G.zip.trail.length = 0;
  G.tutorial = save.plays === 0 ? 1 : 0;
  G.newBest = false;
  save.plays++; persist();
  setState('aim');
  SND.cheer();
  for(let i=0;i<10;i++) emit({kind:'ring',x:LAUNCH_X,y:LAUNCH_Y,r:14,r2:rnd(150,70),size:4,
    h:rnd(360),s:100,l:74,life:rnd(.6,.34),g:0});
}
function setState(s){ G.state=s; G.stateT=0; }

function doLaunch(){
  if(G.state!=='aim' || G.reload>0) return;
  G.zip.launch(G.aimAng, lerp(PMIN,PMAX,G.aimPow));
  setState('fly');
  G.shots++;
  if(G.tutorial===1) G.tutorial=2;
  SND.launch(G.aimPow);
  G.shakeAmt=Math.max(G.shakeAmt, 5);
  const ax=LAUNCH_X+Math.sin(G.aimAng)*MUZZLE, ay=LAUNCH_Y-Math.cos(G.aimAng)*MUZZLE;
  burst(ax,ay,16,42,{spd:300,dir:G.aimAng-Math.PI/2,spread:1.4,g:260});
  emit({kind:'ring',x:ax,y:ay,r:12,r2:80,size:7,h:45,s:100,l:75,life:.4,g:0});
}

function endShot(){
  const z=G.zip;
  z.flying=false;
  // --- skill measurement: how well was this shot predicted? ---
  const quality = clamp(z.starCount/2, 0, 1);
  G.skill = clamp(lerp(G.skill, quality, 0.24), 0, 1);
  save.skill=G.skill; persist();
  if(z.starCount===0) G.assist=Math.min(0.55, G.assist+0.24);
  else                G.assist=Math.max(0,   G.assist-0.18);

  if(z.starCount>0 && G.guideT < 1.0){
    G.score += 200*z.starCount;
    popText(z.x, Math.max(120,z.y-40), 'PREDICTED!', 190, 32);
  }
  const pips=Math.round(G.skill*5);
  if(pips>G.lastSkillPips && pips>0){ popText(VW-232, 104, 'STAR SENSE UP!', 190, 24); SND.star(); }
  G.lastSkillPips=pips;

  G.combo = 0;
  if(G.timeUp){ finishRound(); return; }
  G.reload = RELOAD;
  setState('aim');
}

function finishRound(){
  /* Thresholds tuned from 30 simulated rounds: a confident player lands ~31 rescues,
     a middling one ~22, a first-timer ~16. So 2 stars is very reachable and 3 is a stretch. */
  G.resultStars = G.rescued>=26 ? 3 : G.rescued>=15 ? 2 : 1;
  G.newBest = G.score > save.best;
  if(G.newBest) save.best = G.score;
  if(G.rescued > save.bestRescued) save.bestRescued = G.rescued;
  save.rescued += G.rescued;
  persist();
  setState('over');
  SND.fanfare();
  G.flash=0.5;
  for(let i=0;i<5;i++) setTimeout(()=>confettiBurst(rnd(VW*0.85,VW*0.15), VH*0.42, 44), i*160);
}

/* ================================================================== 10. UPDATE ========== */
function popStar(b){
  b.alive=false; b.pop=0.001;
  G.combo++;
  G.bestCombo=Math.max(G.bestCombo,G.combo);
  const mult=Math.min(G.combo,5);
  SND._panX = b.x/VW;
  G.score += 100*mult;
  G.rescued++;
  G.zip.starCount++;
  G.hitstop=Math.max(G.hitstop,0.07);
  G.shakeAmt=Math.max(G.shakeAmt, 14);
  SND.pop(G.combo-1,1); SND.star();
  burst(b.x,b.y,26,(G.t*90)%360,{spd:520});
  confettiBurst(b.x,b.y,16,{spd:400});
  emit({kind:'ring',x:b.x,y:b.y,r:b.r,r2:b.r*6.5,size:9,h:(G.t*90)%360,s:100,l:78,life:.55,g:0});
  emit({kind:'ring',x:b.x,y:b.y,r:b.r,r2:b.r*4,size:5,h:50,s:100,l:88,life:.36,g:0});
  popText(b.x, b.y-14, mult>1 ? '+'+(100*mult)+'  x'+mult : '+100', 48, mult>1?40:34);
  G.freed.push(new Freed(b.x,b.y,(b.face*67+150)%360,b.face,G.freed.length));
  if(G.combo>=3){ G.fever=1; G.feverT=2.2; }
  b.respawn = 0.45;                       // a new star takes its place shortly
}

function stepBall(dt){
  const z=G.zip, w=G.world;
  z.age+=dt;
  const gravity = GRAV * (z.age>4.5 ? 1+(z.age-4.5)*0.8 : 1);
  const sp=Math.hypot(z.vx,z.vy);
  const steps=clamp(Math.ceil(sp*dt/5), 1, 40);
  const h=dt/steps;
  for(let s=0;s<steps;s++){
    z.vy += gravity*h;
    z.x += z.vx*h; z.y += z.vy*h;
    // walls
    if(z.x < WALL+ZIP_R){ z.x=WALL+ZIP_R; z.vx=Math.abs(z.vx)*0.985; wallFx(z.x,z.y,1); }
    else if(z.x > VW-WALL-ZIP_R){ z.x=VW-WALL-ZIP_R; z.vx=-Math.abs(z.vx)*0.985; wallFx(z.x,z.y,-1); }
    if(z.y < CEIL+ZIP_R){ z.y=CEIL+ZIP_R; z.vy=Math.abs(z.vy)*0.985; wallFx(z.x,z.y,0); }
    // bumpers
    for(const b of w.bumpers){
      const rr=b.r+ZIP_R;
      if(dist2(z.x,z.y,b.x,b.y) < rr*rr){
        let nx=z.x-b.x, ny=z.y-b.y; const d=Math.hypot(nx,ny)||1; nx/=d; ny/=d;
        z.x=b.x+nx*rr; z.y=b.y+ny*rr;
        const dot=z.vx*nx+z.vy*ny;
        z.vx-=2*dot*nx; z.vy-=2*dot*ny; z.vx*=1.02; z.vy*=1.02;
        b.hit=1; z.squash=1;
        SND._panX=b.x/VW; SND.bounce(1.15);
        G.shakeAmt=Math.max(G.shakeAmt,9);
        burst(z.x,z.y,10,b.hue,{spd:290,dir:Math.atan2(ny,nx),spread:2.0});
        emit({kind:'ring',x:b.x,y:b.y,r:b.r,r2:b.r*2.6,size:6,h:b.hue,s:100,l:80,life:.4,g:0});
        G.score+=10;
      }
    }
    // rails
    for(const r of w.rails){
      const cp=r.closest(z.x,z.y), rr=r.r+ZIP_R;
      if(dist2(z.x,z.y,cp.x,cp.y) < rr*rr){
        let nx=z.x-cp.x, ny=z.y-cp.y; const d=Math.hypot(nx,ny)||1; nx/=d; ny/=d;
        z.x=cp.x+nx*rr; z.y=cp.y+ny*rr;
        const dot=z.vx*nx+z.vy*ny; z.vx-=2*dot*nx; z.vy-=2*dot*ny;
        r.hit=1; z.squash=0.8;
        SND._panX=cp.x/VW; SND.rail();
        G.shakeAmt=Math.max(G.shakeAmt,7);
        burst(cp.x,cp.y,9,r.hue,{spd:250,dir:Math.atan2(ny,nx),spread:1.8});
        G.score+=10;
      }
    }
    // stars — an invisible grace radius widens only while the child is struggling
    const grace = 1 + G.assist*0.85;
    for(const b of w.stars){
      if(!b.alive) continue;
      const rr = b.r*grace + ZIP_R*0.86;
      if(dist2(z.x,z.y,b.x,b.y) < rr*rr) popStar(b);
    }
    if(z.y > FLOOR){
      burst(z.x, FLOOR, 14, 30, {spd:280, dir:-Math.PI/2, spread:1.7, g:700});
      emit({kind:'ring',x:z.x,y:FLOOR,r:6,r2:70,size:5,h:35,s:100,l:70,life:.4,g:0});
      SND.bounce(.5);
      endShot(); return;
    }
    if(s%2===0){
      z.trail.push({x:z.x,y:z.y});
      if(z.trail.length>26) z.trail.shift();
    }
  }
  z.squash=Math.max(0, z.squash-dt*4);
  if(Math.random()<0.9){
    emit({kind:'spark',x:z.x+rnd(8,-8),y:z.y+rnd(8,-8),vx:rnd(50,-50)-z.vx*0.05,vy:rnd(50,-50)-z.vy*0.05,
      g:-40,drag:.90,life:rnd(.5,.2),r:rnd(7,3),h:(G.t*160)%360,s:100,l:76});
  }
  if(z.age > 7){ endShot(); }        // a shot can never stall the clock
}
function wallFx(x,y,side){
  SND._panX=x/VW; SND.bounce(0.9);
  G.shakeAmt=Math.max(G.shakeAmt,7);
  burst(x,y,9,200,{spd:250,dir: side===0?Math.PI/2:(side>0?0:Math.PI),spread:1.9});
  emit({kind:'ring',x,y,r:8,r2:52,size:5,h:200,s:100,l:80,life:.35,g:0});
}

function updateGame(dt, clockDt){
  clockDt = clockDt===undefined ? dt : clockDt;
  G.t+=dt; G.stateT+=dt;
  SKY.update(dt);
  SND.fever = G.fever;

  if(G.feverT>0){ G.feverT-=dt; if(G.feverT<=0) G.fever=0; }
  G.flash=Math.max(0,G.flash-dt*2.2);

  // guide length driven by measured skill — the adaptive scaffold
  const eff = clamp(G.skill - G.assist, 0, 1);
  G.guideT = lerp(2.30, 0.42, E.inOutSine(eff));

  if(G.hitstop>0){ G.hitstop-=dt; updateParticles(dt*0.18); shakeUpdate(dt); return; }

  updateParticles(dt);
  shakeUpdate(dt);

  for(const f of G.freed) f.update(dt);
  for(let i=G.freed.length-1;i>=0;i--) if(G.freed[i].dead) G.freed.splice(i,1);

  const w=G.world; if(!w) return;
  for(const b of w.bumpers) b.update(dt);
  for(const r of w.rails) r.update(dt);
  // stars: animate, and recycle popped ones into fresh slots
  for(let i=w.stars.length-1;i>=0;i--){
    const b=w.stars[i];
    b.update(dt,G.t);
    if(!b.alive){
      b.respawn -= dt;
      if(b.respawn<=0 && b.pop>=1){
        w.stars.splice(i,1);
        if(G.state==='aim' || G.state==='fly') spawnStar();
      }
    }
  }

  if(G.state==='title'){ return; }

  if(G.state==='aim' || G.state==='fly'){
    G.roundT += clockDt;
    if(G.tutorial>0 && G.roundT>16) G.tutorial=0;
    if(!G.timeUp){
      G.timeLeft -= clockDt;
      if(G.timeLeft<=0){
        G.timeLeft=0; G.timeUp=true;
        if(G.state==='aim'){ finishRound(); return; }
        popText(VW/2, 210, "LAST SHOT!", 45, 46); SND.star();
      }
    }
  }

  if(G.state==='aim'){
    if(G.reload>0) G.reload-=dt;
    const dir=(keys.r?1:0)-(keys.l?1:0);
    const pdir=(keys.u?1:0)-(keys.d?1:0);
    if(dir!==0) G.aimVel=approach(G.aimVel, dir*1.45, 7.8*dt);
    else G.aimVel*=Math.pow(0.0006,dt);
    G.aimAng=clamp(G.aimAng+G.aimVel*dt, -AIM_MAX, AIM_MAX);
    if((G.aimAng<=-AIM_MAX&&dir<0)||(G.aimAng>=AIM_MAX&&dir>0)) G.aimVel=0;
    if(pdir!==0) G.powVel=approach(G.powVel,pdir*0.85,10.2*dt);
    else G.powVel*=Math.pow(0.0006,dt);
    G.aimPow=clamp(G.aimPow+G.powVel*dt,0,1);
    if((dir!==0||pdir!==0) && Math.random()<dt*14) SND.aim();
    if(Math.random()<G.aimPow*0.9){
      const ax=LAUNCH_X+Math.sin(G.aimAng)*MUZZLE, ay=LAUNCH_Y-Math.cos(G.aimAng)*MUZZLE;
      emit({kind:'spark',x:ax+rnd(10,-10),y:ay+rnd(10,-10),vx:rnd(40,-40),vy:rnd(40,-40),
        g:-90,drag:.9,life:.4,r:rnd(6,2),h:45,s:100,l:80});
    }
  }
  else if(G.state==='fly'){
    stepBall(dt);
  }
}

function shakeUpdate(dt){
  const amp = REDUCED ? G.shakeAmt*0.25 : G.shakeAmt;
  G.shakeX=(Math.random()-.5)*amp*2;
  G.shakeY=(Math.random()-.5)*amp*2;
  G.shakeAmt=Math.max(0, G.shakeAmt - dt*46);
}
